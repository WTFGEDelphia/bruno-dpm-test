info:
  name: 上传日志请查附件
  type: http
  seq: 15
  tags:
    - 日志请查

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload"
  params:
    - name: requestId
      value: ""
      type: query
      description: 日志请查申请ID
    - name: attachmentType
      value: APPLICATION
      type: query
      description: 附件类型：APPLICATION 申请附件，LEADER_DIRECTIVE 领导批示附件
    - name: attachmentType
      value: LEADER_DIRECTIVE
      type: query
      description: 附件类型：APPLICATION 申请附件，LEADER_DIRECTIVE 领导批示附件
      disabled: true
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
        description: 上传文件，支持申请附件或领导批示附件
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/log-requests/attachments/upload"
      method: POST
      params:
        - name: requestId
          value: ""
          type: query
          description: 日志请查申请ID
        - name: attachmentType
          value: APPLICATION
          type: query
          description: 附件类型：APPLICATION 申请附件，LEADER_DIRECTIVE 领导批示附件
        - name: attachmentType
          value: LEADER_DIRECTIVE
          type: query
          description: 附件类型：APPLICATION 申请附件，LEADER_DIRECTIVE 领导批示附件
          disabled: true
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value: []
            description: 上传文件，支持申请附件或领导批示附件
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": 0,
            "timestamp": 0
          }
