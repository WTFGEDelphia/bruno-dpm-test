info:
  name: 初始化日志请查草稿
  type: http
  seq: 8
  tags:
    - 日志请查

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/log-requests/draft"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": 0,
            "timestamp": 0
          }
