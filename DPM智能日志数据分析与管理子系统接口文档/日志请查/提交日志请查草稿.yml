info:
  name: 提交日志请查草稿
  type: http
  seq: 3
  tags:
    - 日志请查

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/submit"
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/log-requests/submit"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": false,
            "timestamp": 0
          }
