        data: |-
          {
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": false,
            "timestamp": 0
          }
