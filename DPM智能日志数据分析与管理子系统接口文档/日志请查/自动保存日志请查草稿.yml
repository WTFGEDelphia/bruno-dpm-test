info:
  name: 自动保存日志请查草稿
  type: http
  seq: 9
  tags:
    - 日志请查

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/update"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "",
        "targetOrgName": "",
        "validDays": 0,
        "urgent": false,
        "requestReason": "",
        "scopes": [
          {
            "systemRange": "",
            "logStartTime": "",
            "logEndTime": ""
          }
        ],
        "applicantAccountId": "",
        "applicantOrgId": "",
        "id": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
