info:
  name: 查询任务告警详情
  type: http
  seq: 5
  tags:
    - 任务告警管理

http:
  method: POST
  url: "{{baseUrl}}/api/v1/task-alarms/detail"
  body:
    type: json
    data: |-
      {
        "jobId": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/task-alarms/detail"
      method: POST
      body:
        type: json
        data: |-
          {
            "jobId": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": {
              "taskId": 0,
              "executionId": 0,
              "alarmType": "",
              "alarmLevel": "",
              "alarmConfig": {},
              "alarmMessage": "",
              "alarmStatus": "",
              "sentChannels": {},
              "sentTime": "",
              "readTime": "",
              "readBy": 0,
              "createdTime": "",
              "id": 0,
              "taskVisible": false
            },
            "timestamp": 0
          }
