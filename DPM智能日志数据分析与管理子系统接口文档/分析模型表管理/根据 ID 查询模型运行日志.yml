info:
  name: 根据 ID 查询模型运行日志
  type: http
  seq: 6
  tags:
    - 分析模型表管理

http:
  method: POST
  url: "{{baseUrl}}/analysisModel/executionLog"
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/analysisModel/executionLog"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": {
              "taskId": 0,
              "executionId": "",
              "startTime": "",
              "endTime": "",
              "status": "",
              "dpmIldaDataSourceId": 0,
              "dpmIldaAnalysisModelId": 0,
              "inputParams": "",
              "outputResult": "",
              "triggerType": "",
              "triggerParams": {},
              "triggerUserId": 0,
              "generatedSql": "",
              "dataCount": 0,
              "progressPercent": 0,
              "executorHost": "",
              "resultData": {},
              "errorType": "",
              "errorMsg": "",
              "executionDuration": 0,
              "retryCount": 0,
              "alarmTriggered": false,
              "alarmTime": "",
              "traceId": "",
              "createdTime": "",
              "id": 0,
              "executionRequestId": "",
              "sourceType": "",
              "principalAccountId": "",
              "principalOrgId": ""
            },
            "timestamp": 0
          }
