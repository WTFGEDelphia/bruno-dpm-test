info:
  name: 根据 ID 手动触发模型关联任务
  type: http
  seq: 4
  tags:
    - 分析模型表管理

http:
  method: POST
  url: "{{baseUrl}}/analysisModel/run"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
  body:
    type: json
    data: |-
      {
        "id": 33
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/analysisModel/run"
