info:
  name: 模型固化 - 配置定时执行
  type: http
  seq: 3
  tags:
    - 分析模型表管理

http:
  method: POST
  url: "{{baseUrl}}/analysisModel/solidify"
  body:
    type: json
    data: |-
      {
        "modelId": 0,
        "cronExpression": "",
        "cronDescription": "",
        "modelName": "",
        "description": "",
        "dataScopeRegType": [],
        "dataScopeRegRegion": [],
        "dataScopeMode": "FIXED",
        "dynamicDays": 7,
        "retainHistory": false,
        "dataScopeStartDate": "2026-04-01",
        "dataScopeEndDate": "2026-12-31"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
