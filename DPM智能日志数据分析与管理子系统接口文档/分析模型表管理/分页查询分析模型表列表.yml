info:
  name: 分页查询分析模型表列表
  type: http
  seq: 5
  tags:
    - 分析模型表管理

http:
  method: POST
  url: "{{baseUrl}}/analysisModel/list"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "sortType": 2,
        "needCount": true,
        "sort": [
          "createdTime"
        ]
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

