        "filter": {
          "alarmTypeCode": "38051d84c0d58c08c33b1bd48047b1d2",
          "dataSource": "dpm-ilda"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
