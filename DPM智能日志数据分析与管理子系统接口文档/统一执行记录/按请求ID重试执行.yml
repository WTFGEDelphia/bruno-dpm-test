info:
  name: 按请求ID重试执行
  type: http
  seq: 1
  tags:
    - 统一执行记录

http:
  method: POST
  url: "{{baseUrl}}/api/v1/execution-records/retry"
  body:
    type: json
    data: |-
      {
        "requestId": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
