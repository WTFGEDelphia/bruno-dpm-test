    description: OK
    request:
      url: "{{baseUrl}}/api/v1/execution-records/retry"
      method: POST
      body:
        type: json
        data: |-
          {
            "requestId": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": {
              "requestId": "",
              "compatExecutionLogId": 0
            },
            "timestamp": 0
          }
