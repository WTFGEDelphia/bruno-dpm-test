info:
  name: 执行模型
  type: http
  seq: 3
  tags:
    - 模型执行

http:
  method: POST
  url: "{{baseUrl}}/api/model/execution/execute"
  body:
    type: json
    data: |-
      {
        "modelId": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/model/execution/execute"
      method: POST
      body:
        type: json
        data: |-
          {
            "modelId": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "{}"

docs: 推荐的手动执行入口，直接执行指定ID的分析模型，不依赖 ScenarioTask 的调度状态。
