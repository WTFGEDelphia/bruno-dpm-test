info:
  name: 04 草稿保存范围开始时间为null
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/update"
  body:
    type: json
    data: |-
      {
        "id": 1,
        "requestReason": "草稿保存字段校验-范围开始时间为null",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": null,
            "logEndTime": "{{logEndTime}}"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectDraftValidationDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          if (expectedText) {
            expect(text).to.contain(expectedText);
          }
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("BindException");
          expect(text).to.not.contain("MethodArgumentNotValidException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(json.data).to.not.equal(true);
        }

        test("草稿保存 logStartTime 为 null 被统一拒绝", () => {
          expectDraftValidationDenied("日志发生开始时间");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
