info:
  name: 02 查询时间筛选详情
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表筛选

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{createdRangeRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("时间筛选详情返回申请编号和创建时间", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("createdRangeRequestId")));
          expect(data.requestNo).to.be.a("string").and.not.empty;
          expect(data.createdTime).to.be.a("string").and.not.empty;
          bru.setVar("createdRangeRequestNo", data.requestNo);
          bru.setVar("createdRangeCreatedTime", data.createdTime);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: createdRangeRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
