info:
  name: 04 申请人不能省厅待办导出
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出
    - 权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{exportTodoRequestNo}}",
        "status": "PENDING",
        "urgent": false,
        "targetOrgId": "{{targetOrgId}}",
        "pageType": "PROVINCE_TODO"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("申请人省厅待办导出被拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason).to.contain("无权");
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(text).to.not.contain(bru.getVar("exportTodoRequestNo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
