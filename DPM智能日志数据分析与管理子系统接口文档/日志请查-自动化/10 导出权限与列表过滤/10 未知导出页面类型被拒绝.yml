info:
  name: 10 未知导出页面类型被拒绝
  type: http
  seq: 10
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出
    - 参数边界

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{exportDoneRequestNo}}",
        "status": "COMPLETED",
        "urgent": true,
        "targetOrgId": "{{targetOrgId}}",
        "pageType": "UNKNOWN"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("未知导出页面类型被拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason).to.contain("页面类型");
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(String(res.getHeader("content-disposition") || "")).to.not.contain("attachment;");
          expect(String(res.getHeader("content-disposition") || "")).to.not.contain("log-requests.xlsx");
          expect(String(res.getHeader("content-type") || "")).to.not.contain("spreadsheetml.sheet");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
