info:
  name: 03 城市侧按编号导出待办
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{exportTodoRequestNo}}",
        "status": "PENDING",
        "urgent": false,
        "targetOrgId": "{{targetOrgId}}",
        "pageType": "CITY"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("城市侧按编号导出待办返回 Excel 文件流", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-disposition")).to.contain("attachment;");
          expect(res.getHeader("content-disposition")).to.contain("log-requests.xlsx");
          expect(res.getHeader("content-type")).to.contain("spreadsheetml.sheet");
          expect(res.getSize().body).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
