info:
  name: 03 待审核列表展示有效天数
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{listPeriodRequestNo}}",
        "status": "PENDING"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("未完成申请列表展示申请有效天数", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("listPeriodRequestId"));
          const matched = (json.data.records || []).find(item => item.id === requestId);
          expect(matched, "地市列表应包含待审核申请").to.exist;
          expect(matched.status).to.equal("PENDING");
          expect(matched.statusDisplay).to.equal("待审核");
          expect(matched.validDays).to.equal(Number(bru.getVar("listPeriodValidDays")));
          expect(matched.validPeriodDisplay).to.equal(bru.getVar("listPeriodValidDays") + "天");
          expect(matched.authorizationStartTime || null).to.equal(null);
          expect(matched.authorizationEndTime || null).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
