info:
  name: 01 创建列表有效期申请
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": 9,
        "urgent": false,
        "requestReason": "{{requestReason}}-列表有效期展示",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("创建列表有效期申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.be.a("number");
          bru.setVar("listPeriodRequestId", String(json.data));
          bru.setVar("listPeriodValidDays", "9");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: listPeriodRequestId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
