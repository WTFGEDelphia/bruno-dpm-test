info:
  name: 06 完成列表展示授权时间
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{listPeriodRequestNo}}",
        "status": "COMPLETED"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("已完成申请列表展示实际授权起止时间", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("listPeriodRequestId"));
          const matched = (json.data.records || []).find(item => item.id === requestId);
          expect(matched, "地市列表应包含已完成申请").to.exist;
          expect(matched.status).to.equal("COMPLETED");
          expect(matched.statusDisplay).to.equal("已完成");
          expect(matched.authorizationStartTime).to.be.a("string").and.not.empty;
          expect(matched.authorizationEndTime).to.be.a("string").and.not.empty;
          expect(matched.validPeriodDisplay).to.equal(matched.authorizationStartTime + " 至 " + matched.authorizationEndTime);
          expect(matched.validPeriodDisplay).to.not.equal(bru.getVar("listPeriodValidDays") + "天");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
