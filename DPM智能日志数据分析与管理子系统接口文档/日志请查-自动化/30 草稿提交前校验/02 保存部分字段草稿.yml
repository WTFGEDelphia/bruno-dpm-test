info:
  name: 02 保存部分字段草稿
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿提交

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/update"
  body:
    type: json
    data: |-
      {
        "id": {{partialDraftId}},
        "requestReason": "草稿提交前校验-部分字段",
        "scopes": []
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("草稿阶段允许保存部分字段", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
