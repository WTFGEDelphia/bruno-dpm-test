info:
  name: 03 部分字段草稿提交被拒绝
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿提交

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/submit"
  body:
    type: json
    data: |-
      {
        "id": {{partialDraftId}},
        "requestReason": "草稿提交前校验-部分字段",
        "scopes": []
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("部分字段草稿不能提交为正式申请", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain("不能为空");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
