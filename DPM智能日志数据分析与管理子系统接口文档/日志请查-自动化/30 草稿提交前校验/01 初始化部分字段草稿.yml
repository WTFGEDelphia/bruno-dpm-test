info:
  name: 01 初始化部分字段草稿
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿提交

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("初始化部分字段草稿成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("partialDraftId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: partialDraftId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
