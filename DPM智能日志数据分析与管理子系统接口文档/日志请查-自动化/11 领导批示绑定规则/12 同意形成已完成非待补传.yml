info:
  name: 12 同意形成已完成非待补传
  type: http
  seq: 12
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{directiveRuleCompletedRequestId}},
        "decision": "同意",
        "opinion": "同意并绑定领导批示形成非待补传状态",
        "directiveAttachmentIds": [{{directiveRuleCompletedAttachmentId}}]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("同意形成已完成非待补传成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
