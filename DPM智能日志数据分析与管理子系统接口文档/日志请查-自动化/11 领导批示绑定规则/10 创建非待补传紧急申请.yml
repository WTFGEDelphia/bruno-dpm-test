info:
  name: 10 创建非待补传紧急申请
  type: http
  seq: 10
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": true,
        "requestReason": "{{requestReason}}-非待补传校验",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("创建非待补传紧急申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          bru.setVar("directiveRuleCompletedRequestId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: directiveRuleCompletedRequestId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
