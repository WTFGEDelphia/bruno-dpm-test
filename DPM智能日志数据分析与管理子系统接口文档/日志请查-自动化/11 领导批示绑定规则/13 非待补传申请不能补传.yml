info:
  name: 13 非待补传申请不能补传
  type: http
  seq: 13
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/directive/supplement"
  body:
    type: json
    data: |-
      {
        "id": {{directiveRuleCompletedRequestId}},
        "directiveAttachmentIds": [{{directiveRuleCompletedAttachmentId}}]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("非待补传申请补传被拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason).to.contain("待补充");
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
