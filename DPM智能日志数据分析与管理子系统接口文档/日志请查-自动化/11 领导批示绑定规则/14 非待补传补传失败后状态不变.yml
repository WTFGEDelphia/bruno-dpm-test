info:
  name: 14 非待补传补传失败后状态不变
  type: http
  seq: 14
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{directiveRuleCompletedRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("非待补传补传失败后仍为已完成且批示已上传", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("directiveRuleCompletedRequestId")));
          expect(json.data.status).to.equal("COMPLETED");
          expect(json.data.directiveStatus).to.equal("UPLOADED");
          expect(json.data.authorization).to.be.an("object");
          expect(json.data.authorization.pendingDirective).to.not.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
