info:
  name: 02 超过10MB附件被拒绝
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P2
    - 附件边界

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{oversizeAttachmentRequestId}}&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/generated/oversize-attachment.csv
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("超过10MB附件被业务拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const reason = String(json.reason || json.message || bodyText());
          expect(reason).to.contain("10MB");
          expect(json.data).to.not.be.a("number");
        });

        test("超大附件失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
