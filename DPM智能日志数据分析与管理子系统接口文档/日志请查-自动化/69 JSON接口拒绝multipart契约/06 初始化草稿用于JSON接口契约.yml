info:
  name: 06 初始化草稿用于JSON接口契约
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 接口契约
    - 草稿

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft"
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("准备 JSON 接口契约草稿成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("jsonOnlyContractDraftId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: jsonOnlyContractDraftId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
