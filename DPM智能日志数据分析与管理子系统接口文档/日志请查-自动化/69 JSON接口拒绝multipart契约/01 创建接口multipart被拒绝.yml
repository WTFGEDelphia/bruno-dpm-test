info:
  name: 01 创建接口multipart被拒绝
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 接口契约

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: multipart-form
    data:
      - name: targetOrgId
        type: text
        value: "{{targetOrgId}}"
      - name: targetOrgName
        type: text
        value: "{{targetOrgName}}"
      - name: validDays
        type: text
        value: "{{validDays}}"
      - name: urgent
        type: text
        value: "false"
      - name: requestReason
        type: text
        value: "{{requestReason}}-创建接口误用multipart"
      - name: file
        type: file
        value:
          - files/fixtures/log-request-application.csv
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectMultipartRejected() {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("HttpMediaTypeNotSupportedException");
          expect(text).to.not.contain("MultipartException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(json.data).to.not.be.a("number");
        }

        test("创建申请接口拒绝 multipart 请求体", () => {
          expectMultipartRejected();
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
