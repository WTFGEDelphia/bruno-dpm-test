info:
  name: 02 待审核上传申请附件
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{voidedAttachmentRequestId}}&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/application-attachment-1.csv
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("待审核状态上传申请附件作为作废后删除负向基线", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.be.a("number");
          bru.setVar("voidedApplicationAttachmentId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: voidedApplicationAttachmentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
