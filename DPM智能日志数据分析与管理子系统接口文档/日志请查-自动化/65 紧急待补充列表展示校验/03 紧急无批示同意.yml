info:
  name: 03 紧急无批示同意
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 紧急审批
    - 展示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{urgentPendingDisplayRequestId}},
        "decision": "同意",
        "opinion": "紧急申请先同意，列表展示待补充批示",
        "directiveAttachmentIds": []
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("紧急无批示同意成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
