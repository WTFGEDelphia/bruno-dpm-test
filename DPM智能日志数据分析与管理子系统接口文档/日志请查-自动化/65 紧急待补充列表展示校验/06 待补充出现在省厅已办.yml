info:
  name: 06 待补充出现在省厅已办
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 紧急审批
    - 列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/done/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{urgentPendingDisplayRequestNo}}",
        "status": "COMPLETED",
        "urgent": true
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("已完成紧急待补充进入省厅已办并展示待补充文案", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const records = json.data.records || [];
          const requestId = Number(bru.getVar("urgentPendingDisplayRequestId"));
          const matched = records.find(item => item.id === requestId);
          expect(matched, "省厅已办应包含紧急待补充申请").to.exist;
          expect(matched.status).to.equal("COMPLETED");
          expect(matched.directiveStatus).to.equal("PENDING");
          expect(matched.urgent).to.equal(true);
          expect(matched.statusDisplay).to.equal("已完成·紧急·待补充");
          expect(JSON.stringify(matched)).to.not.contain("暂存");
          expect(JSON.stringify(matched)).to.not.contain("已撤销");
          expect(JSON.stringify(matched)).to.not.contain("撤销");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
