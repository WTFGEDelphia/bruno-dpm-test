info:
  name: 01 创建账号单位筛选申请
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表筛选

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}-账号单位筛选",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("准备账号单位筛选申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.be.a("number");
          bru.setVar("accountOrgFilterRequestId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: accountOrgFilterRequestId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
