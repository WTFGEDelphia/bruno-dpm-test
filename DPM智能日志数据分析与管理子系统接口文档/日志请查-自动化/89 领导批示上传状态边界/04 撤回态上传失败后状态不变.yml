info:
  name: 04 撤回态上传失败后状态不变
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{directiveUploadWithdrawnRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("撤回态领导批示上传失败后状态和附件不变", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("directiveUploadWithdrawnRequestId")));
          expect(data.status).to.equal("WITHDRAWN");
          expect(data.directiveStatus).to.equal("NONE");
          const directives = (data.attachments || []).filter(item => item.attachmentType === "LEADER_DIRECTIVE");
          expect(directives).to.have.length(0);
          expect(JSON.stringify(data)).to.not.contain("storagePath");
          expect(JSON.stringify(data)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
