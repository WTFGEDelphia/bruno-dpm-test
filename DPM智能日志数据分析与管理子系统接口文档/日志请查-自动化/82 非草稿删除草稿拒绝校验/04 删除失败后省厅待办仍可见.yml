info:
  name: 04 删除失败后省厅待办仍可见
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 省厅列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/todo/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "status": "PENDING"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("删除草稿失败后省厅待办仍包含该申请", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("nonDraftDeleteRequestId"));
          const matched = (json.data.records || []).find(item => item.id === requestId);
          expect(matched, "待审核申请不应被 draft/delete 误删").to.exist;
          expect(matched.status).to.equal("PENDING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
