info:
  name: 12 缺少文件参数被拒绝
  type: http
  seq: 12
  tags:
    - 日志请查
    - 自动化
    - P2
    - 附件边界

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{fileBoundaryRequestBId}}&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: note
        type: text
        value: missing-file-parameter
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("缺少 file 参数被业务拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("file");
        });

        test("缺少文件参数失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
