info:
  name: 02 地市每页条数为null
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 分页参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": null
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectPageNullDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain(expectedText);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("BindException");
          expect(text).to.not.contain("MethodArgumentNotValidException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          if (json.data && typeof json.data === "object") {
            expect(json.data).to.not.have.property("records");
          }
        }

        test("地市分页 pageSize 为 null 被统一拒绝", () => {
          expectPageNullDenied("每页条数");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
