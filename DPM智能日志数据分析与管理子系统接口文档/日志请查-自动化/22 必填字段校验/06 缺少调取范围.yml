info:
  name: 06 缺少调取范围
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 必填字段

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}-缺少调取范围"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectValidationDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const reason = String(json.reason || json.message || JSON.stringify(json));
          expect(reason).to.contain(expectedText);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          return json;
        }

        test("缺少调取范围被拒绝", () => {
          expectValidationDenied("调取范围");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
