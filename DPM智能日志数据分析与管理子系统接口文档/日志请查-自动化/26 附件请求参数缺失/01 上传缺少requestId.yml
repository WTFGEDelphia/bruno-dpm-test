info:
  name: 01 上传缺少requestId
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/log-request-application.csv
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectMissingParam(paramName) {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain(paramName);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        }

        test("上传缺少 requestId 被统一拒绝", () => {
          expectMissingParam("requestId");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
