info:
  name: 05 非法审批结论被拒绝
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批规则

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{approvalRuleRequestId}},
        "decision": "通过一下",
        "opinion": "非法审批结论",
        "directiveAttachmentIds": []
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectBusinessDenied() {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          return json;
        }

        test("非法审批结论被拒绝", () => {
          const json = expectBusinessDenied();
          expect(json.reason).to.contain("审批结论");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
