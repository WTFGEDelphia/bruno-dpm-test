info:
  name: 05 错申请删除后申请A附件仍可下载
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download"
  body:
    type: json
    data: |-
      {
        "attachmentId": {{attachmentMismatchApplicationId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("错申请删除失败后申请A附件仍可下载", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-disposition") || "")).to.contain("attachment;");
          expect(String(res.getHeader("content-disposition") || "")).to.contain("application-attachment-1.csv");
          expect(res.getSize().body).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
