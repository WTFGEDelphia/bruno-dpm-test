info:
  name: 07 类型错配后申请A附件仍未删除
  type: http
  seq: 7
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{attachmentMismatchRequestAId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("类型错配删除失败后申请A附件仍是当前有效附件", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("attachmentMismatchRequestAId")));
          expect(data.status).to.equal("PENDING");
          const attachmentId = Number(bru.getVar("attachmentMismatchApplicationId"));
          const matched = (data.attachments || []).find(item => item.id === attachmentId);
          expect(matched, "申请A附件应仍然存在").to.exist;
          expect(matched.attachmentType).to.equal("APPLICATION");
          expect(matched.deleted).to.not.equal(true);
          expect(matched.downloadable).to.not.equal(false);
          expect(JSON.stringify(data)).to.not.contain("storagePath");
          expect(JSON.stringify(data)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
