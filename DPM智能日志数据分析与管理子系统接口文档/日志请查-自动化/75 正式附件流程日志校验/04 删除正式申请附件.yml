info:
  name: 04 删除正式申请附件
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件
    - 流程日志

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/delete"
  body:
    type: json
    data: |-
      {
        "requestId": {{formalAttachmentFlowRequestId}},
        "attachmentId": {{formalAttachmentFlowAttachmentId}},
        "attachmentType": "APPLICATION"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("删除正式申请附件成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
