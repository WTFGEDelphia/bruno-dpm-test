info:
  name: 04 校验授权有效期
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{authPeriodRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function parseLocalDateTime(value) {
          expect(value).to.be.a("string").and.not.empty;
          return new Date(value.replace(" ", "T"));
        }

        test("授权有效期等于申请validDays", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("authPeriodRequestId")));
          expect(data.status).to.equal("COMPLETED");
          expect(data.directiveStatus).to.equal("UPLOADED");
          expect(data.validDays).to.equal(Number(bru.getVar("authPeriodValidDays")));
          expect(data.authorization).to.be.an("object");
          expect(data.authorization.authorizationType).to.equal("LOG_READ");
          const start = parseLocalDateTime(data.authorization.authorizationStartTime);
          const end = parseLocalDateTime(data.authorization.authorizationEndTime);
          const diffDays = Math.round((end.getTime() - start.getTime()) / (24 * 60 * 60 * 1000));
          expect(diffDays).to.equal(Number(bru.getVar("authPeriodValidDays")));
        });

        test("授权范围继承申请范围且不待补传", () => {
          const data = res.getBody().data;
          expect(data.authorization.pendingDirective).to.not.equal(true);
          expect(data.scopes).to.be.an("array").that.is.not.empty;
          expect(data.authorization.scopes).to.be.an("array").that.is.not.empty;
          expect(data.authorization.scopes.length).to.equal(data.scopes.length);
          expect(JSON.stringify(data.authorization)).to.not.contain("storagePath");
          expect(JSON.stringify(data.authorization)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
