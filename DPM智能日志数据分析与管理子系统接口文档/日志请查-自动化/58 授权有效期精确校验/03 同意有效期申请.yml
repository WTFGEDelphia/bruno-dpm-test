info:
  name: 03 同意有效期申请
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{authPeriodRequestId}},
        "decision": "同意",
        "opinion": "授权有效期精确校验-同意审批",
        "directiveAttachmentIds": [
          {{authPeriodDirectiveId}}
        ]
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("同意有效期申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
