info:
  name: 02 保存有意义草稿
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/update"
  body:
    type: json
    data: |-
      {
        "id": {{draftExportDraftId}},
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}-草稿导出排除",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("保存有意义草稿成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
