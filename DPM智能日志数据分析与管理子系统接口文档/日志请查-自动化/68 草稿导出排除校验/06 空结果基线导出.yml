info:
  name: 06 空结果基线导出
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "__draft_export_empty_baseline__",
        "status": "DRAFT",
        "pageType": "CITY"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("草稿导出体积与空结果基线一致", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-disposition") || "")).to.contain("attachment;");
          expect(String(res.getHeader("content-type") || "")).to.contain("spreadsheetml.sheet");
          const baselineSize = res.getSize().body;
          const draftSize = Number(bru.getVar("draftExportSize"));
          expect(baselineSize).to.be.greaterThan(0);
          expect(draftSize).to.equal(baselineSize);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
