info:
  name: 01 初始化导出草稿
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft"
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("初始化导出草稿成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          bru.setVar("draftExportDraftId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: draftExportDraftId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
