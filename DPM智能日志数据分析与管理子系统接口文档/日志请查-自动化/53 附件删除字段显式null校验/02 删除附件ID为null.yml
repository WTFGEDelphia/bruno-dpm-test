info:
  name: 02 删除附件ID为null
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/delete"
  body:
    type: json
    data: |-
      {
        "requestId": 1,
        "attachmentId": null,
        "attachmentType": "APPLICATION"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectDeleteNullDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain(expectedText);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("BindException");
          expect(text).to.not.contain("MethodArgumentNotValidException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(json.data).to.not.equal(true);
        }

        test("附件删除 attachmentId 为 null 被统一拒绝", () => {
          expectDeleteNullDenied("附件ID");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
