info:
  name: 06 补传领导批示
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P0
    - 紧急审批

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/directive/supplement"
  body:
    type: json
    data: |-
      {
        "id": {{urgentRequestId}},
        "directiveAttachmentIds": [{{urgentDirectiveAttachmentId}}]
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("补传领导批示成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
