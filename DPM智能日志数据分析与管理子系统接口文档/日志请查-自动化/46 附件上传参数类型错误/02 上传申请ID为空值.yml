info:
  name: 02 上传申请ID为空值
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId=&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/log-request-application.csv
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectUploadParamDenied() {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("MethodArgumentTypeMismatchException");
          expect(text).to.not.contain("NumberFormatException");
          expect(text).to.not.contain("InvalidFormatException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(json.data).to.not.be.a("number");
        }

        test("上传 requestId 空值返回统一错误", () => {
          expectUploadParamDenied();
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
