info:
  name: 02 查询授权主体审批前详情
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{authSubjectRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("审批前记录申请人身份且无授权", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("authSubjectRequestId")));
          expect(data.status).to.equal("PENDING");
          expect(data.authorization || null).to.equal(null);
          expect(data.applicantName).to.be.a("string").and.not.empty;
          bru.setVar("authSubjectApplicantName", data.applicantName);
          bru.setVar("authSubjectRequestNo", data.requestNo);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: authSubjectRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
