info:
  name: 06 省厅查看授权主体不变
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{authSubjectRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅视角不会成为授权主体", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.authorization).to.be.an("object");
          expect(data.authorization.authorizationSubjectName).to.equal(bru.getVar("authSubjectApplicantName"));
          expect(String(data.authorization.authorizationSubjectId || "")).to.equal(bru.getVar("authSubjectSubjectId"));
          expect(data.authorization.authorizationStartTime).to.equal(bru.getVar("authSubjectStart"));
          expect(data.authorization.authorizationEndTime).to.equal(bru.getVar("authSubjectEnd"));
          const approved = (data.flowLogs || []).find(item => item.actionText === "处置办理：同意" || item.conclusion === "同意");
          expect(approved, "审批流程日志应存在").to.exist;
          if (approved.operatorName !== bru.getVar("authSubjectApplicantName")) {
            expect(data.authorization.authorizationSubjectName).to.not.equal(approved.operatorName);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
