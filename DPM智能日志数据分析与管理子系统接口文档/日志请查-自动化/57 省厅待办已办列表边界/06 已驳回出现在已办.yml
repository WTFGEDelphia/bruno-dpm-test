info:
  name: 06 已驳回出现在已办
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 省厅列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/done/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{provinceBoundaryRequestNo}}",
        "status": "REJECTED"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("已驳回申请应出现在省厅已办", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("provinceBoundaryRequestId"));
          const records = json.data.records || [];
          const matched = records.find(item => item.id === requestId);
          expect(matched, "省厅已办应包含已驳回申请").to.exist;
          expect(matched.status).to.equal("REJECTED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
