info:
  name: 04 整改续办重新提交
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 整改续办

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/resubmit"
  body:
    type: json
    data: |-
      {
        "id": {{resubmitReplaceRequestId}},
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": 5,
        "urgent": true,
        "requestReason": "{{requestReason}}-整改续办字段替换重提",
        "scopes": [
          {
            "systemRange": "整改续办系统范围",
            "logStartTime": "2026-05-03 00:00:00",
            "logEndTime": "2026-05-04 00:00:00"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("整改续办重新提交成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
