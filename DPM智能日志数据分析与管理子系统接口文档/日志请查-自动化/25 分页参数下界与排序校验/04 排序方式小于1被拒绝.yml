info:
  name: 04 排序方式小于1被拒绝
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 分页参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "sort": ["createdTime"],
        "sortType": 0
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectValidationDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const reason = String(json.reason || json.message || JSON.stringify(json));
          expect(reason).to.contain(expectedText);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          return json;
        }

        test("排序方式小于1被拒绝", () => {
          expectValidationDenied("排序方式");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
