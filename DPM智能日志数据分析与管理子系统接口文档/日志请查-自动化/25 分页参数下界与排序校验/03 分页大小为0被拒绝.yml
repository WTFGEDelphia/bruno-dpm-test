info:
  name: 03 分页大小为0被拒绝
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 分页参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 0,
        "status": "PENDING"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectValidationDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const reason = String(json.reason || json.message || JSON.stringify(json));
          expect(reason).to.contain(expectedText);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          return json;
        }

        test("分页大小为0被拒绝", () => {
          expectValidationDenied("每页条数");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
