info:
  name: 03 上传领导批示2
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{multiDirectiveRequestId}}&attachmentType=LEADER_DIRECTIVE"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/leader-directive-2.csv
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("上传领导批示2成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.be.a("number");
          expect(json.data).to.not.equal(Number(bru.getVar("multiDirectiveFirstId")));
          bru.setVar("multiDirectiveSecondId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: multiDirectiveSecondId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
