info:
  name: 03 审批失败后仍待审核
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{missingDirectiveApprovalRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("不存在批示审批失败后申请仍待审核且无授权", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("missingDirectiveApprovalRequestId")));
          expect(data.status).to.equal("PENDING");
          expect(data.directiveStatus).to.equal("NONE");
          expect(data.authorization || null).to.equal(null);
          const approveLogs = (data.flowLogs || []).filter(item =>
            item.actionText === "处置办理：同意" || item.conclusion === "同意"
          );
          expect(approveLogs).to.have.length(0);
          expect(JSON.stringify(data)).to.not.contain("storagePath");
          expect(JSON.stringify(data)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
