info:
  name: 08 重复撤回后仍已撤回
  type: http
  seq: 8
  tags:
    - 日志请查
    - 自动化
    - P1
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{stateGuardRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("重复撤回失败后状态仍为 WITHDRAWN 且只有一次撤回日志", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.status).to.equal("WITHDRAWN");
          const withdrawLogs = (json.data.flowLogs || []).filter(item => item.actionText === "撤回日志请查申请" || item.nodeName === "申请撤回");
          expect(withdrawLogs).to.have.length(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
