info:
  name: 01 导出缺少页码
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出参数

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageSize": 10,
        "requestNo": "",
        "status": "PENDING",
        "urgent": false,
        "targetOrgId": "{{targetOrgId}}",
        "pageType": "CITY"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectExportValidationDenied(expectedText) {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain(expectedText);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(String(res.getHeader("content-disposition") || "")).to.not.contain("attachment;");
          expect(String(res.getHeader("content-disposition") || "")).to.not.contain("log-requests.xlsx");
          expect(String(res.getHeader("content-type") || "")).to.not.contain("spreadsheetml.sheet");
          return json;
        }

        test("导出缺少 pageNum 被拒绝且不返回文件流", () => {
          expectExportValidationDenied("页码");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
