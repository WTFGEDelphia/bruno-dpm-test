info:
  name: 03 紧急同意A形成待补传
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 补传

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{supplementValidationRequestAId}},
        "decision": "同意",
        "opinion": "紧急申请先行同意，后续校验补传附件绑定",
        "directiveAttachmentIds": []
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("紧急同意A形成待补传成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
