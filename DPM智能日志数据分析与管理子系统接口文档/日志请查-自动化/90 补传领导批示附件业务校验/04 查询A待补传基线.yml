info:
  name: 04 查询A待补传基线
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 补传

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{supplementValidationRequestAId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("A基线为已完成紧急待补传且授权有效", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("supplementValidationRequestAId")));
          expect(data.status).to.equal("COMPLETED");
          expect(data.urgent).to.equal(true);
          expect(data.directiveStatus).to.equal("PENDING");
          expect(data.authorization).to.be.an("object");
          expect(data.authorization.authorizationType).to.equal("LOG_READ");
          expect(data.authorization.pendingDirective).to.equal(true);
          expect(data.authorization.authorizationStartTime).to.be.a("string").and.not.empty;
          expect(data.authorization.authorizationEndTime).to.be.a("string").and.not.empty;
          const supplementLogs = (data.flowLogs || []).filter(item =>
            item.actionText === "处置办理：补充领导批示" || item.nodeName === "补传领导批示"
          );
          expect(supplementLogs).to.have.length(0);
          bru.setVar("supplementValidationAuthorizationStartTime", data.authorization.authorizationStartTime);
          bru.setVar("supplementValidationAuthorizationEndTime", data.authorization.authorizationEndTime);
        });

        test("A基线详情不泄露存储路径", () => {
          const text = JSON.stringify(res.getBody().data);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
