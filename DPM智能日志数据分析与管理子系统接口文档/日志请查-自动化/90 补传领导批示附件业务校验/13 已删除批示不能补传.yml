info:
  name: 13 已删除批示不能补传
  type: http
  seq: 13
  tags:
    - 日志请查
    - 自动化
    - P1
    - 补传

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/directive/supplement"
  body:
    type: json
    data: |-
      {
        "id": {{supplementValidationRequestAId}},
        "directiveAttachmentIds": [{{supplementValidationDeletedDirectiveId}}]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("已删除领导批示不能用于补传", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(json.reason || json.message || text).to.contain("领导批示附件已删除");
          expect(json.data).to.not.equal(true);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
