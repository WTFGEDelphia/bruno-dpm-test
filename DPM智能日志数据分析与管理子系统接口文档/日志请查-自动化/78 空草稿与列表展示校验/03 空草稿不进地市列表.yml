info:
  name: 03 空草稿不进地市列表
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{emptyDraftListRequestNo}}",
        "status": "DRAFT"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("无意义空草稿不进入本人地市列表", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("emptyDraftListId"));
          const records = json.data.records || [];
          expect(records.some(item => item.id === requestId)).to.equal(false);
          expect(records.some(item => item.requestNo === bru.getVar("emptyDraftListRequestNo"))).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
