info:
  name: 03 提交草稿
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P0
    - 草稿链路

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/submit"
  body:
    type: json
    data: |-
      {
        "id": {{draftId}},
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ],
        "applicantAccountId": "forged-submit-applicant-account-should-be-ignored",
        "applicantOrgId": "forged-submit-applicant-org-should-be-ignored"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("提交草稿成功", () => {
          const json = expectSuccess();
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
