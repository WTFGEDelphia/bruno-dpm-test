info:
  name: 05 地市列表校验
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P0
    - 草稿链路

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{requestNo}}",
        "status": "PENDING"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("地市列表返回当前提交申请", () => {
          const json = expectSuccess();
          expect(json.data).to.be.an("object");
          expect(json.data.records).to.be.an("array");
          const requestId = Number(bru.getVar("requestId"));
          const matched = json.data.records.find(item => item.id === requestId);
          expect(matched, "列表应包含刚提交的申请").to.exist;
          expect(matched.status).to.equal("PENDING");
          expect(matched.requestNo).to.equal(bru.getVar("requestNo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
