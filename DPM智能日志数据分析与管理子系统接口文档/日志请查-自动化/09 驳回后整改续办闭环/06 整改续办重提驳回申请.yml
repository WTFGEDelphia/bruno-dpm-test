info:
  name: 06 整改续办重提驳回申请
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P0
    - 驳回整改

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/resubmit"
  body:
    type: json
    data: |-
      {
        "id": {{rejectResubmitRequestId}},
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}-驳回后已补充材料并整改重提",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ],
        "applicantAccountId": "forged-resubmit-account-should-be-ignored",
        "applicantOrgId": "forged-resubmit-org-should-be-ignored"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("驳回申请整改续办重新提交成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
