info:
  name: 02 查询驳回前详情
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P0
    - 驳回整改

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{rejectResubmitRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("驳回前为待审核申请", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("rejectResubmitRequestId")));
          expect(json.data.status).to.equal("PENDING");
          expect(json.data.urgent).to.equal(false);
          expect(json.data.authorization || null).to.equal(null);
          expect(json.data.requestNo).to.be.a("string").and.not.empty;
          expect(JSON.stringify(json.data)).to.not.contain("forged-applicant-account-should-be-ignored");
          expect(JSON.stringify(json.data)).to.not.contain("forged-applicant-org-should-be-ignored");
          bru.setVar("rejectResubmitRequestNo", json.data.requestNo);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: rejectResubmitRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
