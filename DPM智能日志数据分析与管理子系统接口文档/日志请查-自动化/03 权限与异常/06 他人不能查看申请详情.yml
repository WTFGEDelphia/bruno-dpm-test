info:
  name: 06 他人不能查看申请详情
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{securityRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectBusinessDenied() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(text).to.not.contain(bru.getEnvVar("requestReason"));
          return json;
        }

        test("其他申请人查看详情被拒绝", () => {
          const json = expectBusinessDenied();
          expect(json.reason).to.contain("无权");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
