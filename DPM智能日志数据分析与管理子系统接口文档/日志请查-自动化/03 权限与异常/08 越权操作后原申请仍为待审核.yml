info:
  name: 08 越权操作后原申请仍为待审核
  type: http
  seq: 8
  tags:
    - 日志请查
    - 自动化
    - P1
    - 权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{securityRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("越权操作没有改变申请状态", () => {
          const json = expectSuccess();
          expect(json.data.id).to.equal(Number(bru.getVar("securityRequestId")));
          expect(json.data.status).to.equal("PENDING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
