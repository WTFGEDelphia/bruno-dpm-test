info:
  name: 10 已驳回删除后详情
  type: http
  seq: 10
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{rejectedAttachmentRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("已驳回申请删除附件后当前附件列表移除该附件", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.status).to.equal("REJECTED");
          const attachmentId = Number(bru.getVar("rejectedAttachmentId"));
          expect((data.attachments || []).some(item => item.id === attachmentId)).to.equal(false);
          expect(JSON.stringify(data)).to.not.contain("storagePath");
          expect(JSON.stringify(data)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
