info:
  name: 01 一次性创建正式申请
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P0
    - 生命周期

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "{{logStartTime}}",
            "logEndTime": "{{logEndTime}}"
          }
        ],
        "applicantAccountId": "forged-applicant-account-should-be-ignored",
        "applicantOrgId": "forged-applicant-org-should-be-ignored"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("创建正式申请返回真实申请ID", () => {
          const json = expectSuccess();
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("lifecycleRequestId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: lifecycleRequestId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
