info:
  name: 05 查询撤回后详情
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P0
    - 生命周期

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{lifecycleRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("撤回后状态为 WITHDRAWN", () => {
          const json = expectSuccess();
          expect(json.data.id).to.equal(Number(bru.getVar("lifecycleRequestId")));
          expect(json.data.status).to.equal("WITHDRAWN");
        });

        test("撤回产生用户可见流程日志", () => {
          const flowLogs = body().data.flowLogs || [];
          expect(flowLogs.some(item => item.actionText === "撤回日志请查申请" || item.nodeName === "申请撤回")).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
