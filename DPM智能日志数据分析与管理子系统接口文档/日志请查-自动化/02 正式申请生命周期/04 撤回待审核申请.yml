info:
  name: 04 撤回待审核申请
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P0
    - 生命周期

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/withdraw"
  body:
    type: json
    data: |-
      {
        "id": {{lifecycleRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("撤回待审核申请成功", () => {
          const json = expectSuccess();
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
