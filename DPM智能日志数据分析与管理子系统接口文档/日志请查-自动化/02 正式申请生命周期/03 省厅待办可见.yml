info:
  name: 03 省厅待办可见
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P0
    - 生命周期

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/todo/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{lifecycleRequestNo}}",
        "status": "PENDING",
        "urgent": false,
        "targetOrgId": "{{targetOrgId}}"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("省厅待办包含刚创建的待审核申请", () => {
          const json = expectSuccess();
          expect(json.data).to.be.an("object");
          expect(json.data.records).to.be.an("array");
          const requestId = Number(bru.getVar("lifecycleRequestId"));
          const matched = json.data.records.find(item => item.id === requestId);
          expect(matched, "省厅待办应包含当前 PENDING 申请").to.exist;
          expect(matched.status).to.equal("PENDING");
          expect(matched.requestNo).to.equal(bru.getVar("lifecycleRequestNo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
