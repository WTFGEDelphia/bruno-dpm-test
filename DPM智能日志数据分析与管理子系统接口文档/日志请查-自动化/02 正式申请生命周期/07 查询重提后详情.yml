info:
  name: 07 查询重提后详情
  type: http
  seq: 7
  tags:
    - 日志请查
    - 自动化
    - P0
    - 生命周期

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{lifecycleRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        function expectSuccess() {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          return json;
        }

        test("重提后同一申请回到 PENDING", () => {
          const json = expectSuccess();
          expect(json.data.id).to.equal(Number(bru.getVar("lifecycleRequestId")));
          expect(json.data.status).to.equal("PENDING");
          expect(json.data.requestNo).to.equal(bru.getVar("lifecycleRequestNo"));
          expect(json.data.requestReason).to.contain("整改续办");
        });

        test("重提产生申请修改和重新提交流程日志", () => {
          const flowLogs = body().data.flowLogs || [];
          const text = JSON.stringify(flowLogs);
          expect(text).to.contain("申请修改");
          expect(text).to.contain("重新提交");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
