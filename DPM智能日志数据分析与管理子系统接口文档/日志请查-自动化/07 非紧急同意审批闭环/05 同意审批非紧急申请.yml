info:
  name: 05 同意审批非紧急申请
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P0
    - 审批闭环

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{approvalRequestId}},
        "decision": "同意",
        "opinion": "同意按申请范围进行日志调取",
        "directiveAttachmentIds": [{{directiveAttachmentId}}]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("同意审批非紧急申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
