info:
  name: 07 省厅已办包含审批申请
  type: http
  seq: 7
  tags:
    - 日志请查
    - 自动化
    - P0
    - 审批闭环

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/done/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{approvalRequestNo}}",
        "status": "COMPLETED",
        "urgent": false,
        "targetOrgId": "{{targetOrgId}}"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅已办包含已完成审批申请", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const requestId = Number(bru.getVar("approvalRequestId"));
          const records = json.data.records || [];
          const matched = records.find(item => item.id === requestId);
          expect(matched, "省厅已办应包含已完成申请").to.exist;
          expect(matched.status).to.equal("COMPLETED");
          expect(matched.directiveStatus).to.equal("UPLOADED");
          expect(matched.requestNo).to.equal(bru.getVar("approvalRequestNo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
