info:
  name: 02 查询编号申请A
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 申请编号

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{requestNoSeqFirstId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function parseRequestNo(value) {
          expect(value).to.be.a("string").and.not.empty;
          const matched = /^RZQC(\d{8})(\d{4})$/.exec(value);
          expect(matched, "申请编号应符合 RZQCyyyyMMddNNNN").to.not.equal(null);
          return {
            prefix: "RZQC" + matched[1],
            sequence: Number(matched[2])
          };
        }

        test("编号申请A详情返回规范申请编号", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("requestNoSeqFirstId")));
          const parsed = parseRequestNo(data.requestNo);
          expect(parsed.sequence).to.be.greaterThan(0);
          bru.setVar("requestNoSeqFirstNo", data.requestNo);
          bru.setVar("requestNoSeqPrefix", parsed.prefix);
          bru.setVar("requestNoSeqFirstSequence", String(parsed.sequence));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: requestNoSeqFirstNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
