info:
  name: 04 查询编号申请B并比较
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 申请编号

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{requestNoSeqSecondId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function parseRequestNo(value) {
          expect(value).to.be.a("string").and.not.empty;
          const matched = /^RZQC(\d{8})(\d{4})$/.exec(value);
          expect(matched, "申请编号应符合 RZQCyyyyMMddNNNN").to.not.equal(null);
          return {
            prefix: "RZQC" + matched[1],
            sequence: Number(matched[2])
          };
        }

        test("连续创建申请编号唯一且流水不倒退", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("requestNoSeqSecondId")));
          const firstNo = bru.getVar("requestNoSeqFirstNo");
          expect(data.requestNo).to.not.equal(firstNo);
          const first = {
            prefix: bru.getVar("requestNoSeqPrefix"),
            sequence: Number(bru.getVar("requestNoSeqFirstSequence"))
          };
          const second = parseRequestNo(data.requestNo);
          if (second.prefix === first.prefix) {
            expect(second.sequence).to.be.greaterThan(first.sequence);
          } else {
            expect(second.prefix).to.be.greaterThan(first.prefix);
          }
        });

        test("编号申请B仍为正式待审核申请", () => {
          const data = res.getBody().data;
          expect(data.status).to.equal("PENDING");
          expect(data.flowLogs || []).to.satisfy(logs =>
            logs.some(item => item.actionText === "提交日志请查申请" || item.nodeName === "申请提交")
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
