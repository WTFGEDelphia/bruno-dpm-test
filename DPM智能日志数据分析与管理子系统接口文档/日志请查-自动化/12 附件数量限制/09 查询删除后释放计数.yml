info:
  name: 09 查询删除后释放计数
  type: http
  seq: 9
  tags:
    - 日志请查
    - 自动化
    - P2
    - 附件
    - 数量限制

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{attachmentLimitRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function activeApplicationAttachments(attachments) {
          return (attachments || []).filter(item => item.attachmentType === "APPLICATION" && item.deleted !== true);
        }

        test("删除后释放同类型附件计数并保持 3 个未删除 APPLICATION", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const activeAttachments = activeApplicationAttachments(json.data.attachments);
          const activeIds = activeAttachments.map(item => item.id);
          expect(activeAttachments).to.have.length(3);
          expect(activeIds).to.not.include(Number(bru.getVar("applicationLimitAttachment1Id")));
          expect(activeIds).to.include(Number(bru.getVar("applicationLimitAttachment2Id")));
          expect(activeIds).to.include(Number(bru.getVar("applicationLimitAttachment3Id")));
          expect(activeIds).to.include(Number(bru.getVar("applicationLimitReplacementAttachmentId")));
          expect(activeAttachments.find(item => item.id === Number(bru.getVar("applicationLimitReplacementAttachmentId"))).fileName).to.equal("application-attachment-replacement.csv");
        });

        test("详情附件列表不泄露存储路径", () => {
          const text = JSON.stringify(res.getBody().data.attachments || []);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
