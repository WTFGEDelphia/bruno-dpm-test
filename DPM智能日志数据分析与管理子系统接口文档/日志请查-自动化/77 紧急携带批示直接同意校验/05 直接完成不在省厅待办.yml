info:
  name: 05 直接完成不在省厅待办
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/todo/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{urgentWithDirectiveRequestNo}}"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("紧急直接完成后不在省厅待办", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("urgentWithDirectiveRequestId"));
          const records = json.data.records || [];
          expect(records.find(item => item.id === requestId)).to.not.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
