info:
  name: 04 查询紧急直接完成详情
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{urgentWithDirectiveRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("紧急携带批示同意后不待补充", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.status).to.equal("COMPLETED");
          expect(data.urgent).to.equal(true);
          expect(data.requestNo).to.be.a("string").and.not.empty;
          bru.setVar("urgentWithDirectiveRequestNo", data.requestNo);
          expect(data.directiveStatus).to.equal("UPLOADED");
          expect(data.statusDisplay).to.not.contain("待补充");
          expect(data.authorization).to.be.an("object");
          expect(data.authorization.pendingDirective).to.not.equal(true);
          expect(data.authorization.statusDisplay).to.equal("有效");
        });

        test("审批流程日志绑定紧急领导批示", () => {
          const data = res.getBody().data;
          const attachmentId = Number(bru.getVar("urgentWithDirectiveAttachmentId"));
          const approved = (data.flowLogs || []).find(item => item.actionText === "处置办理：同意" || item.conclusion === "同意");
          expect(approved, "审批流程日志应存在").to.exist;
          expect(JSON.stringify(approved.directiveAttachmentIds || [])).to.contain(String(attachmentId));
          const directive = (data.attachments || []).find(item => item.id === attachmentId);
          expect(directive, "当前领导批示附件应可见").to.exist;
          expect(directive.attachmentType).to.equal("LEADER_DIRECTIVE");
          const text = JSON.stringify(data);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: urgentWithDirectiveRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
