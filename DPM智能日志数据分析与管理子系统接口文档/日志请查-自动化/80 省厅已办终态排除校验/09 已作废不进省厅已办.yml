info:
  name: 09 已作废不进省厅已办
  type: http
  seq: 9
  tags:
    - 日志请查
    - 自动化
    - P1
    - 省厅列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/done/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{doneExcludeVoidRequestNo}}",
        "status": "VOIDED"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("已作废申请不进入省厅已办", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("doneExcludeVoidRequestId"));
          const records = json.data.records || [];
          expect(records.find(item => item.id === requestId)).to.not.exist;
          expect(records.some(item => item.status === "VOIDED")).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
