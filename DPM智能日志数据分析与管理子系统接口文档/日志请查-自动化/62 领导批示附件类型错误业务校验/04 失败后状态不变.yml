info:
  name: 04 失败后状态不变
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{directiveTypeRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("类型错误审批失败后申请仍待审核", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("directiveTypeRequestId")));
          expect(data.status).to.equal("PENDING");
          expect(data.directiveStatus).to.equal("NONE");
          expect(data.authorization || null).to.equal(null);
          const attachments = data.attachments || [];
          const applicationAttachment = attachments.find(item => String(item.id) === String(bru.getVar("applicationAttachmentAsDirectiveId")));
          expect(applicationAttachment).to.be.an("object");
          expect(applicationAttachment.attachmentType).to.equal("APPLICATION");
          expect(JSON.stringify(data)).to.not.contain("storagePath");
          expect(JSON.stringify(data)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
