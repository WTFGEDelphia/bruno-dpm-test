info:
  name: 03 上传MinIO申请附件
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件
    - MinIO

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{minioAttachmentRequestId}}&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/application-attachment-1.csv
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        function env(name) {
          return String(bru.getEnvVar(name) || "").trim();
        }

        const required = ["applicantToken", "minioEndpoint", "minioAccessKey", "minioSecretKey", "minioBucket"];
        if (required.some(name => !env(name)) || !String(bru.getVar("minioAttachmentRequestId") || "").trim()) {
          bru.runner.skipRequest();
        }
    - type: tests
      code: |-
        test("上传申请附件成功并返回附件ID", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("minioApplicationAttachmentId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: minioApplicationAttachmentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
