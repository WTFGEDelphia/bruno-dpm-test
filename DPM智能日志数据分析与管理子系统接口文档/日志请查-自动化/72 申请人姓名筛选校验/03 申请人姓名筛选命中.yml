info:
  name: 03 申请人姓名筛选命中
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表筛选

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{applicantNameFilterRequestNo}}",
        "applicantName": "{{applicantNameFilterName}}"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("使用服务端申请人姓名筛选命中当前申请", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("applicantNameFilterRequestId"));
          const records = json.data.records || [];
          const matched = records.find(item => item.id === requestId);
          expect(matched, "申请人姓名筛选应命中当前申请").to.exist;
          expect(matched.requestNo).to.equal(bru.getVar("applicantNameFilterRequestNo"));
          expect(matched.applicantName).to.equal(bru.getVar("applicantNameFilterName"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
