info:
  name: 03 上传后草稿无流程日志
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{draftAttachmentFlowDraftId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("草稿上传附件后附件可见但无用户流程日志", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.status).to.equal("DRAFT");
          expect(data.flowLogs || []).to.have.length(0);
          const attachmentId = Number(bru.getVar("draftAttachmentFlowAttachmentId"));
          const attachments = data.attachments || [];
          const matched = attachments.find(item => item.id === attachmentId);
          expect(matched, "草稿详情应显示已上传申请附件").to.exist;
          expect(matched.attachmentType).to.equal("APPLICATION");
          expect(matched.deleted).to.not.equal(true);
          expect(JSON.stringify(data)).to.not.contain("上传日志请查附件");
          expect(JSON.stringify(data)).to.not.contain("storagePath");
          expect(JSON.stringify(data)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
