info:
  name: 10 省厅下载领导批示
  type: http
  seq: 10
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download?attachmentId={{attachmentPermissionDirectiveId}}"
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅可下载自己上传的领导批示附件", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-disposition")).to.contain("attachment;");
          expect(res.getHeader("content-disposition")).to.contain("leader-directive.csv");
          expect(res.getSize().body).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
