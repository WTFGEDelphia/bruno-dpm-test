info:
  name: 06 他人不能删除申请附件
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/delete"
  body:
    type: json
    data: |-
      {
        "requestId": {{attachmentPermissionRequestId}},
        "attachmentId": {{attachmentPermissionApplicationId}},
        "attachmentType": "APPLICATION"
      }
  auth:
    type: bearer
    token: "{{otherApplicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("其他申请人删除申请附件被拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("仅申请人本人");
        });

        test("他人删除申请附件失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
