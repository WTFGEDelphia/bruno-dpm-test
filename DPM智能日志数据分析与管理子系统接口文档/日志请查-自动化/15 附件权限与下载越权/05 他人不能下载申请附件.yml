info:
  name: 05 他人不能下载申请附件
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download"
  body:
    type: json
    data: |-
      {
        "attachmentId": {{attachmentPermissionApplicationId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("其他申请人下载申请附件被拒绝且不返回文件流", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("无权");
          expect(res.getHeader("content-disposition") || "").to.not.contain("attachment;");
        });

        test("他人下载申请附件失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
