info:
  name: 07 他人操作失败后申请附件仍可下载
  type: http
  seq: 7
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download?attachmentId={{attachmentPermissionApplicationId}}"
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("他人越权操作失败后本人仍可下载申请附件", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-disposition")).to.contain("attachment;");
          expect(res.getHeader("content-disposition")).to.contain("log-request-application.csv");
          expect(res.getSize().body).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
