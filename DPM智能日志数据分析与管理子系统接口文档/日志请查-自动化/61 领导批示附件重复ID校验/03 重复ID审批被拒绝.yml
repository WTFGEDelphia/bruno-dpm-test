info:
  name: 03 重复ID审批被拒绝
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{duplicateDirectiveRequestId}},
        "decision": "同意",
        "opinion": "尝试重复绑定同一个领导批示附件",
        "directiveAttachmentIds": [
          {{duplicateDirectiveAttachmentId}},
          {{duplicateDirectiveAttachmentId}}
        ]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("重复领导批示附件ID审批被业务拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain("领导批示附件无效");
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
