info:
  name: logout-sww
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/public_ws/sys/user/logout"
  body:
    type: json
    data: "{}"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
