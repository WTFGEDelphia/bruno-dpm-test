info:
  name: 05 完成态不能上传领导批示
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{attachmentStateRequestId}}&attachmentType=LEADER_DIRECTIVE"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/leader-directive-2.csv
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("已完成且批示已上传申请不能继续上传领导批示", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.contain("仅待审核或待补充批示申请可上传领导批示附件");
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
