info:
  name: 03 英文AGREE同意审批
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批兼容

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{approvalCompatAgreeRequestId}},
        "decision": "AGREE",
        "opinion": "English decision AGREE should be accepted",
        "directiveAttachmentIds": [{{approvalCompatAgreeDirectiveId}}]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("英文 AGREE 同意审批成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
