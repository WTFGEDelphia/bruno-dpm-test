info:
  name: 08 超长办理意见被拒绝
  type: http
  seq: 8
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批边界

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{approvalLongOpinionRequestId}},
        "decision": "AGREE",
        "opinion": "{{longReasonPart1}}{{longReasonPart2}}{{longReasonPart3}}",
        "directiveAttachmentIds": []
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("办理意见超过 500 字被业务拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("办理意见");
          expect(json.reason || json.message || bodyText()).to.contain("500");
        });

        test("超长意见失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
