info:
  name: 14 重复审批失败后仍已驳回
  type: http
  seq: 14
  tags:
    - 日志请查
    - 自动化
    - P1
    - 重复审批

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{approvalCompatDisagreeRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("重复审批失败后已驳回申请状态不变", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.status).to.equal("REJECTED");
          expect(json.data.directiveStatus).to.equal("NONE");
          expect(json.data.authorization || null).to.equal(null);
          const rejectLogs = (json.data.flowLogs || []).filter(item => item.actionText === "处置办理：不同意" || item.conclusion === "不同意");
          expect(rejectLogs).to.have.length(1);
          expect(JSON.stringify(json.data.flowLogs || [])).to.not.contain("已驳回申请不能再次审批");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
