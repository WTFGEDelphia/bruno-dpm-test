info:
  name: 06 重复审批失败后仍已完成
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 重复审批

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{approvalCompatAgreeRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("重复审批失败后已完成申请状态不变", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.status).to.equal("COMPLETED");
          expect(json.data.directiveStatus).to.equal("UPLOADED");
          expect(json.data.authorization).to.be.an("object");
          const approvalLogs = (json.data.flowLogs || []).filter(item => item.actionText === "处置办理：同意" || item.conclusion === "同意");
          expect(approvalLogs).to.have.length(1);
          expect(JSON.stringify(json.data.flowLogs || [])).to.not.contain("已完成申请不能再次审批");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
