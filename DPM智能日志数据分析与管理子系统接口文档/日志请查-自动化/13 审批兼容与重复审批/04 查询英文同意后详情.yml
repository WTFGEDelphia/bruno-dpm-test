info:
  name: 04 查询英文同意后详情
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批兼容

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{approvalCompatAgreeRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function approvalLogs(flowLogs) {
          return (flowLogs || []).filter(item => item.actionText === "处置办理：同意" || item.conclusion === "同意");
        }

        test("英文 AGREE 审批后状态为已完成", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("approvalCompatAgreeRequestId")));
          expect(json.data.status).to.equal("COMPLETED");
          expect(json.data.directiveStatus).to.equal("UPLOADED");
          expect(json.data.authorization).to.be.an("object");
          expect(json.data.authorization.authorizationType).to.equal("LOG_READ");
        });

        test("英文 AGREE 审批流程日志按同意记录", () => {
          const json = res.getBody();
          const logs = approvalLogs(json.data.flowLogs);
          expect(logs).to.have.length(1);
          expect(logs[0].opinion).to.contain("English decision AGREE");
          expect(JSON.stringify(logs[0].directiveAttachmentIds || [])).to.contain(bru.getVar("approvalCompatAgreeDirectiveId"));
          expect(JSON.stringify(logs[0])).to.not.contain("storagePath");
          expect(JSON.stringify(logs[0])).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
