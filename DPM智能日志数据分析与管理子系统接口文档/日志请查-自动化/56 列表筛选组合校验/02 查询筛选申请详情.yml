info:
  name: 02 查询筛选申请详情
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表筛选

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{filterComboRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("筛选申请详情字段可用于后续列表筛选", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("filterComboRequestId")));
          expect(json.data.requestNo).to.be.a("string").and.not.empty;
          expect(json.data.status).to.equal("PENDING");
          expect(json.data.urgent).to.equal(true);
          expect(json.data.targetOrgName).to.be.a("string").and.not.empty;
          bru.setVar("filterComboRequestNo", json.data.requestNo);
          bru.setVar("filterComboTargetOrgName", json.data.targetOrgName);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: filterComboRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
