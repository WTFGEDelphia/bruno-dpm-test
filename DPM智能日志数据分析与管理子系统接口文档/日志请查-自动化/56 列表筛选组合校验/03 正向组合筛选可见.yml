info:
  name: 03 正向组合筛选可见
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表筛选

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{filterComboRequestNo}}",
        "status": "PENDING",
        "urgent": true,
        "targetOrgId": "{{targetOrgId}}"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function records() {
          const json = res.getBody();
          expect(res.getStatus()).to.equal(200);
          expect(json.code).to.equal(200);
          return json.data.records || [];
        }

        test("本人按编号状态紧急和目标机构组合筛选可见", () => {
          const requestId = Number(bru.getVar("filterComboRequestId"));
          const matched = records().find(item => item.id === requestId);
          expect(matched, "组合筛选应命中当前申请").to.exist;
          expect(matched.requestNo).to.equal(bru.getVar("filterComboRequestNo"));
          expect(matched.status).to.equal("PENDING");
          expect(matched.urgent).to.equal(true);
          expect(matched.targetOrgName).to.equal(bru.getVar("filterComboTargetOrgName"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
