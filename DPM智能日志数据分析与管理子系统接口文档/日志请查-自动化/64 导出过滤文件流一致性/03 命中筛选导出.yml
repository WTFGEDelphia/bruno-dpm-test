info:
  name: 03 命中筛选导出
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{exportConsistencyRequestNo}}",
        "status": "PENDING",
        "urgent": true,
        "targetOrgId": "{{targetOrgId}}",
        "pageType": "CITY"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("命中筛选导出返回非空 Excel 文件流", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-disposition") || "")).to.contain("attachment;");
          expect(String(res.getHeader("content-disposition") || "")).to.contain("log-requests.xlsx");
          expect(String(res.getHeader("content-type") || "")).to.contain("spreadsheetml.sheet");
          const size = res.getSize().body;
          expect(size).to.be.greaterThan(0);
          bru.setVar("exportConsistencyHitSize", String(size));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
