info:
  name: 10 本人删除草稿
  type: http
  seq: 10
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/delete"
  body:
    type: json
    data: |-
      {
        "id": {{draftIsolationDraftId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("申请人本人删除草稿成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
