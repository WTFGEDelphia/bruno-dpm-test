info:
  name: 02 查询列表隔离详情
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{listIsolationRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("列表隔离申请详情可由本人查看并保存申请编号", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("listIsolationRequestId")));
          expect(json.data.status).to.equal("PENDING");
          expect(json.data.requestNo).to.be.a("string").and.not.empty;
          expect(json.data.requestReason).to.contain("列表筛选权限隔离");
          expect(JSON.stringify(json.data)).to.not.contain("forged-list-filter-account-should-be-ignored");
          expect(JSON.stringify(json.data)).to.not.contain("forged-list-filter-org-should-be-ignored");
          bru.setVar("listIsolationRequestNo", json.data.requestNo);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: listIsolationRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
