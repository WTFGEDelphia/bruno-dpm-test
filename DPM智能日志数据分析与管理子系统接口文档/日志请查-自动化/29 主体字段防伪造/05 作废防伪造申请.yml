info:
  name: 05 作废防伪造申请
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 主体防伪造

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/void"
  body:
    type: json
    data: |-
      {
        "id": {{trustedFieldRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("作废防伪造申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
