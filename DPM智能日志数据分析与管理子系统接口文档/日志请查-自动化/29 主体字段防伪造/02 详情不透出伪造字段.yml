info:
  name: 02 详情不透出伪造字段
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 主体防伪造

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{trustedFieldRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        const forgedMarkers = [
          "forged-target-org-name-should-be-ignored",
          "forged-trusted-field-account-should-be-ignored",
          "forged-trusted-field-org-should-be-ignored"
        ];

        test("详情使用服务端可信主体和机构信息", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.an("object");
          expect(json.data.id).to.equal(Number(bru.getVar("trustedFieldRequestId")));
          expect(json.data.status).to.equal("PENDING");
          expect(json.data.requestNo).to.be.a("string").and.not.empty;
          expect(json.data.targetOrgName).to.be.a("string").and.not.empty;
          expect(json.data.targetOrgName).to.not.equal("forged-target-org-name-should-be-ignored");
          expect(json.data.applicantName).to.be.a("string").and.not.empty;
          expect(json.data.applicantOrgName).to.be.a("string").and.not.empty;
          bru.setVar("trustedFieldRequestNo", json.data.requestNo);
        });

        test("详情和流程日志不泄露客户端伪造字段", () => {
          const text = JSON.stringify(res.getBody().data || {});
          forgedMarkers.forEach(marker => expect(text).to.not.contain(marker));
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: trustedFieldRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
