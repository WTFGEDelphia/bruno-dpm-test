info:
  name: 06 查询作废后仍不透出伪造字段
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 主体防伪造

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{trustedFieldRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        const forgedMarkers = [
          "forged-target-org-name-should-be-ignored",
          "forged-trusted-field-account-should-be-ignored",
          "forged-trusted-field-org-should-be-ignored"
        ];

        test("作废后状态正确且仍不透出伪造字段", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("trustedFieldRequestId")));
          expect(json.data.status).to.equal("VOIDED");
          const text = JSON.stringify(json.data);
          forgedMarkers.forEach(marker => expect(text).to.not.contain(marker));
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
