info:
  name: 06 删除后下载被拒绝
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download?attachmentId={{applicationAttachmentId}}"
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("删除后不能下载附件", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason).to.contain("已删除");
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
