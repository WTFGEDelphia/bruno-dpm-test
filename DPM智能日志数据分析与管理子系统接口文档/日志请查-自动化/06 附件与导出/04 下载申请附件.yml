info:
  name: 04 下载申请附件
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download"
  body:
    type: json
    data: |-
      {
        "attachmentId": {{applicationAttachmentId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("下载申请附件返回文件流", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-disposition")).to.contain("attachment;");
          expect(res.getHeader("content-disposition")).to.contain("log-request-application.csv");
          expect(res.getSize().body).to.be.greaterThan(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
