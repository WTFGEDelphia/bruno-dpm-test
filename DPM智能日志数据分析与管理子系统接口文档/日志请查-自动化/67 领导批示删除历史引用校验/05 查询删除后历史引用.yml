info:
  name: 05 查询删除后历史引用
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示
    - 流程日志

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{directiveHistoryRequestId}}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("当前附件列表不再展示已删除领导批示", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.status).to.equal("COMPLETED");
          expect(data.directiveStatus).to.equal("UPLOADED");
          const attachmentId = Number(bru.getVar("directiveHistoryAttachmentId"));
          const current = data.attachments || [];
          expect(current.some(item => item.id === attachmentId)).to.equal(false);
        });

        test("审批流程日志保留已删除领导批示历史引用", () => {
          const data = res.getBody().data;
          const attachmentId = Number(bru.getVar("directiveHistoryAttachmentId"));
          const flowLogs = data.flowLogs || [];
          const approved = flowLogs.find(item => item.actionText === "处置办理：同意" || item.conclusion === "同意");
          expect(approved, "审批流程日志应存在").to.exist;
          expect(approved.flowSide).to.equal("PROVINCE");
          expect(JSON.stringify(approved.directiveAttachmentIds || [])).to.contain(String(attachmentId));
          const directiveDelete = flowLogs.find(item =>
            (item.actionText === "删除日志请查附件" || item.nodeName === "附件删除")
              && JSON.stringify(item.directiveAttachmentIds || []).includes(String(attachmentId))
          );
          expect(directiveDelete, "删除领导批示应写入省厅侧附件删除流程日志").to.exist;
          expect(directiveDelete.flowSide).to.equal("PROVINCE");
          const historical = approved.directiveAttachments || [];
          const matched = historical.find(item => item.id === attachmentId);
          expect(matched, "历史领导批示元信息应保留").to.exist;
          expect(matched.attachmentType).to.equal("LEADER_DIRECTIVE");
          expect(matched.deleted).to.equal(true);
          expect(matched.downloadable).to.equal(false);
          const text = JSON.stringify(data);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("storageBucket");
          expect(text).to.not.contain("endpoint");
          expect(text).to.not.contain("bucket");
          expect(text).to.not.contain("objectName");
          expect(text).to.not.contain("accessKey");
          expect(text).to.not.contain("secretKey");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
