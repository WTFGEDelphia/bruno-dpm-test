info:
  name: 04 删除已引用批示
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/delete"
  body:
    type: json
    data: |-
      {
        "requestId": {{directiveHistoryRequestId}},
        "attachmentId": {{directiveHistoryAttachmentId}},
        "attachmentType": "LEADER_DIRECTIVE"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅删除已引用领导批示成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
