info:
  name: 04 下载附件ID非数字
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 参数类型

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/download"
  body:
    type: json
    data: |-
      {
        "attachmentId": "not-a-number"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
runtime:
  scripts:
    - type: tests
      code: |-
        function expectNumberTypeDenied() {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("HttpMessageNotReadableException");
          expect(text).to.not.contain("MethodArgumentTypeMismatchException");
          expect(text).to.not.contain("NumberFormatException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("storageBucket");
          expect(text).to.not.contain("endpoint");
          expect(text).to.not.contain("bucket");
          expect(text).to.not.contain("objectName");
          expect(text).to.not.contain("accessKey");
          expect(text).to.not.contain("secretKey");
          expect(text).to.not.contain("/Users/");
          expect(String(res.getHeader("content-disposition") || "")).to.not.contain("attachment;");
        }

        test("下载 attachmentId 非数字返回统一错误且不返回文件流", () => {
          expectNumberTypeDenied();
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
