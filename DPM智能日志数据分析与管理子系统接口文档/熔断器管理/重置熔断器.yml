info:
  name: 重置熔断器
  type: http
  seq: 2
  tags:
    - 熔断器管理

http:
  method: POST
  url: "{{baseUrl}}/api/circuit-breaker/reset"
  body:
    type: json
    data: |-
      {
        "name": "modelRunner"
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/circuit-breaker/reset"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "modelRunner"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "{}"

docs: 将指定熔断器重置到初始状态
