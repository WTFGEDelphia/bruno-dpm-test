info:
  name: 查询熔断器状态
  type: http
  seq: 1
  tags:
    - 熔断器管理

http:
  method: POST
  url: "{{baseUrl}}/api/circuit-breaker/state"
  body:
    type: json
    data: |-
      {
        "name": "modelRunner"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/circuit-breaker/state"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "modelRunner"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "name": "modelRunner",
            "state": "CLOSED",
            "metrics": {
              "failureRate": "5.00%",
              "slowCallRate": "0.00%",
              "numberOfBufferedCalls": 10,
              "numberOfFailedCalls": 1,
              "numberOfSuccessfulCalls": 9,
              "numberOfNotPermittedCalls": 0
            },
            "config": {
              "slidingWindowSize": 10,
              "failureRateThreshold": "50.00%",
              "slowCallRateThreshold": "100.00%",
              "waitDurationInOpenState": 30,
              "permittedNumberOfCallsInHalfOpenState": 3,
              "minimumNumberOfCalls": 5
            }
          }

docs: 获取指定熔断器的详细状态
