info:
  name: 立即执行任务
  type: http
  seq: 3
  tags:
    - 任务管理

http:
  method: POST
  url: "{{baseUrl}}/job-management/run"
  body:
    type: json
    data: |-
      {
        "jobId": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/job-management/run"
      method: POST
      body:
        type: json
        data: |-
          {
            "jobId": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": false,
            "timestamp": 0
          }
