info:
  name: 创建模型（支持自动创建场景任务和调度任务）
  type: http
  seq: 1
  tags:
    - 模型编排管理

http:
  method: POST
  url: "{{baseUrl}}/api/v1/model-orchestration/createWithTask"
  body:
    type: json
    data: |-
      {
        "modelCode": "",
        "modelName": "",
        "modelType": 0,
        "description": "",
        "ownerId": "",
        "orgId": "",
        "version": "",
        "status": 0,
        "algorithmTemplateId": 0,
        "sourceTable": "",
        "createdTime": "",
        "updatedTime": "",
        "createdBy": "",
        "updatedBy": "",
        "dataScopeRegType": [],
        "dataScopeRegRegion": [],
        "dataScopeStartDate": "",
        "dataScopeEndDate": "",
        "autoCreateTask": false,
        "taskName": "",
        "cronExpression": "",
        "executorParam": "",
        "executorHandler": ""
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

