info:
  name: 获取版本历史
  type: http
  seq: 4
  tags:
    - 模型版本表管理

http:
  method: POST
  url: "{{baseUrl}}/modelVersion/history"
  body:
    type: json
    data: |-
      {
        "modelId": 0,
        "pageNum": 0,
        "pageSize": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/modelVersion/history"
      method: POST
      body:
        type: json
        data: |-
          {
            "modelId": 0,
            "pageNum": 0,
            "pageSize": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "records": [
              {
                "modelId": 0,
                "version": "",
                "changeLog": "",
                "canvasData": {
                  "empty": false
                },
                "nodeKeys": {},
                "logicExpression": "",
                "generatedSql": "",
                "sqlParams": {
                  "empty": false
                },
                "sourceTable": "",
                "isCurrent": 0,
                "createdTime": "",
                "createdBy": 0,
                "id": 0
              }
            ],
            "total": 0,
            "current": 0,
            "pageNum": 0,
            "pageSize": 0
          }
