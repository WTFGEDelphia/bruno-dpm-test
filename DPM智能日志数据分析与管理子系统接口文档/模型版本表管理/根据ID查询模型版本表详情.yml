info:
  name: 根据ID查询模型版本表详情
  type: http
  seq: 5
  tags:
    - 模型版本表管理

http:
  method: POST
  url: "{{baseUrl}}/modelVersion/detail"
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/modelVersion/detail"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "modelId": 0,
            "version": "",
            "changeLog": "",
            "canvasData": {
              "empty": false
            },
            "nodeKeys": {},
            "logicExpression": "",
            "generatedSql": "",
            "sqlParams": {
              "empty": false
            },
            "sourceTable": "",
            "isCurrent": 0,
            "createdTime": "",
            "createdBy": 0,
            "id": 0
          }
