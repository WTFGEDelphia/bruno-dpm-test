info:
  name: 根据ID查询算法组件定义表（含通用算子和算子组）详情
  type: http
  seq: 3
  tags:
    - 算法组件定义表_含通用算子和算子组_管理

http:
  method: POST
  url: "{{baseUrl}}/algorithmComponent/detail"
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/algorithmComponent/detail"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "componentCode": "",
            "componentName": "",
            "componentType": 0,
            "category": 0,
            "description": "",
            "dbTableName": "",
            "dbFieldName": "",
            "dbFieldType": "",
            "isGroup": 0,
            "groupContent": {
              "empty": false
            },
            "applicableRegions": {},
            "sortOrder": 0,
            "status": 0,
            "createdTime": "",
            "updatedTime": "",
            "id": 0
          }
