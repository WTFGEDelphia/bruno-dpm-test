info:
  name: 03 申请人账号筛选命中
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表筛选

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{accountOrgFilterRequestNo}}",
        "applicantAccountId": "{{applicantAccountId}}"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("按当前申请人账号筛选命中本人申请", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("accountOrgFilterRequestId"));
          const matched = (json.data.records || []).find(item => item.id === requestId);
          expect(matched, "申请人账号筛选应命中当前申请").to.exist;
          expect(matched.requestNo).to.equal(bru.getVar("accountOrgFilterRequestNo"));
          expect(matched.status).to.equal("PENDING");
          expect(JSON.stringify(matched)).to.not.contain("storagePath");
          expect(JSON.stringify(matched)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
