info:
  name: 02 上传正式申请附件
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件
    - 流程日志

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{formalAttachmentFlowRequestId}}&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/application-attachment-1.csv
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("上传正式申请附件成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.be.a("number");
          bru.setVar("formalAttachmentFlowAttachmentId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: formalAttachmentFlowAttachmentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
