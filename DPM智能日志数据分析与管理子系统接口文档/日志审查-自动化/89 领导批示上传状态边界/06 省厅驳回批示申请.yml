info:
  name: 06 省厅驳回批示申请
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P1
    - 领导批示
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{directiveUploadRejectedRequestId}},
        "decision": "不同意",
        "opinion": "驳回后校验领导批示上传状态边界"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅驳回批示申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
