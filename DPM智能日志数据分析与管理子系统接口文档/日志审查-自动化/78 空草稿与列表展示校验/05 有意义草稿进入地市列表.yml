info:
  name: 05 有意义草稿进入地市列表
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{emptyDraftListRequestNo}}",
        "status": "DRAFT"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("保存有意义内容后草稿进入本人地市列表", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("emptyDraftListId"));
          const records = json.data.records || [];
          const matched = records.find(item => item.id === requestId);
          expect(matched, "有意义草稿应在本人地市列表可继续编辑").to.exist;
          expect(matched.requestNo).to.equal(bru.getVar("emptyDraftListRequestNo"));
          expect(matched.status).to.equal("DRAFT");
          expect(matched.statusDisplay).to.equal("草稿");
          expect(matched.validPeriodDisplay || "").to.equal("");
          expect(JSON.stringify(matched)).to.not.contain("storagePath");
          expect(JSON.stringify(matched)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
