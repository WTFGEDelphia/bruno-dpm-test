info:
  name: 04 显式CITY导出
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{defaultExportRequestNo}}",
        "status": "PENDING",
        "urgent": false,
        "targetOrgId": "{{targetOrgId}}",
        "pageType": "CITY"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("显式 CITY 与默认 pageType 导出一致", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-disposition") || "")).to.contain("attachment;");
          expect(String(res.getHeader("content-type") || "")).to.contain("spreadsheetml.sheet");
          const explicitSize = res.getSize().body;
          const implicitSize = Number(bru.getVar("defaultExportImplicitSize"));
          expect(explicitSize).to.be.greaterThan(0);
          expect(implicitSize).to.be.greaterThan(0);
          expect(explicitSize).to.equal(implicitSize);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
