info:
  name: 05 他人不能查看草稿
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{draftIsolationDraftId}}
      }
  auth:
    type: bearer
    token: "{{otherApplicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("其他申请人查看草稿被拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("无权");
          expect(bodyText()).to.not.contain("草稿隔离");
        });

        test("他人查看草稿失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
