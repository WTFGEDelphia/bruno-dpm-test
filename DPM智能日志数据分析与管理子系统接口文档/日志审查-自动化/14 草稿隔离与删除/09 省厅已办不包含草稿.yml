info:
  name: 09 省厅已办不包含草稿
  type: http
  seq: 9
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 列表

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/done/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "status": "DRAFT"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅已办列表不返回草稿", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const requestId = Number(bru.getVar("draftIsolationDraftId"));
          const records = json.data.records || [];
          expect(records.some(item => item.id === requestId)).to.equal(false);
          expect(records.some(item => item.status === "DRAFT")).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
