info:
  name: 01 省厅不能初始化草稿
  type: http
  seq: 1
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft"
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("省厅账号初始化草稿被拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("无权");
          expect(json.data).to.not.be.a("number");
        });

        test("省厅初始化草稿失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
