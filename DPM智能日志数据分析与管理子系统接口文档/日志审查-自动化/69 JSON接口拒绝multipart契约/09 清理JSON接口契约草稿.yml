info:
  name: 09 清理JSON接口契约草稿
  type: http
  seq: 9
  tags:
    - 日志请查
    - 自动化
    - P1
    - 接口契约
    - 草稿

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/delete"
  body:
    type: json
    data: |-
      {
        "id": {{jsonOnlyContractDraftId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("multipart 误用失败后草稿仍可通过 JSON 删除", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
