info:
  name: 07 日志范围超过180天被拒绝
  type: http
  seq: 7
  tags:
    - 日志请查
    - 自动化
    - P1
    - 参数边界

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/create"
  body:
    type: json
    data: |-
      {
        "targetOrgId": "{{targetOrgId}}",
        "targetOrgName": "{{targetOrgName}}",
        "validDays": {{validDays}},
        "urgent": false,
        "requestReason": "{{requestReason}}-范围超过180天",
        "scopes": [
          {
            "systemRange": "{{systemRange}}",
            "logStartTime": "2026-01-01 00:00:00",
            "logEndTime": "2026-07-01 00:00:00"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectBusinessDenied() {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          return json;
        }

        test("日志范围超过180天被拒绝", () => {
          const json = expectBusinessDenied();
          expect(json.reason).to.contain("180天");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
