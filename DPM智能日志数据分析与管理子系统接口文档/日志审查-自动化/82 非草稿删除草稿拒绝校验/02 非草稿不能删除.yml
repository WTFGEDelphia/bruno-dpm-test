info:
  name: 02 非草稿不能删除
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/draft/delete"
  body:
    type: json
    data: |-
      {
        "id": {{nonDraftDeleteRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("PENDING 申请不能通过删除草稿接口删除", () => {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(json.reason || json.message || text).to.contain("仅草稿申请可删除");
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
