info:
  name: 07 他人不能查看授权详情
  type: http
  seq: 7
  tags:
    - 日志请查
    - 自动化
    - P1
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{authSubjectRequestId}}
      }
  auth:
    type: bearer
    token: "{{otherApplicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("其他申请人不能查看授权详情", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.not.contain(bru.getVar("authSubjectRequestNo"));
          expect(text).to.not.contain(bru.getVar("authSubjectApplicantName"));
          if (bru.getVar("authSubjectSubjectId")) {
            expect(text).to.not.contain(bru.getVar("authSubjectSubjectId"));
          }
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
