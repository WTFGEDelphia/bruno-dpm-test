info:
  name: 05 申请人查看授权主体
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 授权

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{authSubjectRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("申请人视角授权主体为原申请人", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.status).to.equal("COMPLETED");
          expect(data.authorization).to.be.an("object");
          expect(data.authorization.authorizationType).to.equal("LOG_READ");
          expect(data.authorization.authorizationSubjectName).to.equal(bru.getVar("authSubjectApplicantName"));
          expect(data.authorization.authorizationSubjectId).to.be.a("string").and.not.empty;
          bru.setVar("authSubjectSubjectId", data.authorization.authorizationSubjectId);
          bru.setVar("authSubjectStart", data.authorization.authorizationStartTime);
          bru.setVar("authSubjectEnd", data.authorization.authorizationEndTime);
          const approved = (data.flowLogs || []).find(item => item.actionText === "处置办理：同意" || item.conclusion === "同意");
          expect(approved, "审批流程日志应存在").to.exist;
          expect(approved.operatorName).to.be.a("string").and.not.empty;
          if (approved.operatorName !== bru.getVar("authSubjectApplicantName")) {
            expect(data.authorization.authorizationSubjectName).to.not.equal(approved.operatorName);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
