info:
  name: 04 导出null请求体
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 请求体格式

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/export"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: file
    data:
      - filePath: files/fixtures/json-null-body.txt
        contentType: application/json
        selected: true
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectBodyTypeDenied() {
          expect(res.getStatus()).to.equal(200);
          expect(String(res.getHeader("content-type") || "").toLowerCase()).to.not.contain("text/html");
          const json = res.getBody();
          expect(json).to.be.an("object");
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text.toLowerCase()).to.not.contain("<html");
          expect(text).to.not.contain("Whitelabel Error Page");
          expect(text).to.not.contain("HttpMessageNotReadableException");
          expect(text).to.not.contain("MismatchedInputException");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          expect(String(res.getHeader("content-disposition") || "")).to.not.contain("attachment;");
          expect(String(res.getHeader("content-type") || "")).to.not.contain("spreadsheetml.sheet");
        }

        test("导出 null 请求体返回统一错误且不返回文件流", () => {
          expectBodyTypeDenied();
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
