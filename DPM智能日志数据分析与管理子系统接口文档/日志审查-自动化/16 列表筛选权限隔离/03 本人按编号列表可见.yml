info:
  name: 03 本人按编号列表可见
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 列表权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/city/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{listIsolationRequestNo}}",
        "status": "PENDING"
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("申请人本人按申请编号查询列表可见", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const requestId = Number(bru.getVar("listIsolationRequestId"));
          const records = json.data.records || [];
          const matched = records.find(item => item.id === requestId);
          expect(matched, "本人列表应包含当前申请").to.exist;
          expect(matched.requestNo).to.equal(bru.getVar("listIsolationRequestNo"));
          expect(matched.status).to.equal("PENDING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
