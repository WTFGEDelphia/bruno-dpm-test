info:
  name: 12 删除申请A待删除批示
  type: http
  seq: 12
  tags:
    - 日志请查
    - 自动化
    - P1
    - 补传
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/delete"
  body:
    type: json
    data: |-
      {
        "requestId": {{supplementValidationRequestAId}},
        "attachmentId": {{supplementValidationDeletedDirectiveId}},
        "attachmentType": "LEADER_DIRECTIVE"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("删除申请A待删除领导批示成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
