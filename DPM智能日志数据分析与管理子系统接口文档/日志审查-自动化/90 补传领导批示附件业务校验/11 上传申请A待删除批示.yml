info:
  name: 11 上传申请A待删除批示
  type: http
  seq: 11
  tags:
    - 日志请查
    - 自动化
    - P1
    - 补传
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{supplementValidationRequestAId}}&attachmentType=LEADER_DIRECTIVE"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/leader-directive-2.csv
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("上传申请A待删除领导批示成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("supplementValidationDeletedDirectiveId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: supplementValidationDeletedDirectiveId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
