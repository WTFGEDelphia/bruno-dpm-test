info:
  name: 04 省厅已办列表包含申请
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/province/done/page"
  body:
    type: json
    data: |-
      {
        "pageNum": 1,
        "pageSize": 10,
        "requestNo": "{{doneExportPermissionRequestNo}}",
        "status": "COMPLETED"
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("省厅已办列表可见该申请作为权限负向基线", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const requestId = Number(bru.getVar("doneExportPermissionRequestId"));
          const matched = (json.data.records || []).find(item => item.id === requestId);
          expect(matched, "省厅已办应包含完成申请").to.exist;
          expect(matched.status).to.equal("COMPLETED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
