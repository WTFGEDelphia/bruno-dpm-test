info:
  name: 03 紧急带批示同意
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批
    - 领导批示

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{urgentWithDirectiveRequestId}},
        "decision": "同意",
        "opinion": "紧急携带批示直接同意",
        "directiveAttachmentIds": [
          {{urgentWithDirectiveAttachmentId}}
        ]
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("紧急携带批示同意成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
