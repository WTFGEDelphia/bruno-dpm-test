info:
  name: 04 申请人上传申请附件
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 附件权限

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{attachmentPermissionRequestId}}&attachmentType=APPLICATION"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/log-request-application.csv
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("申请人上传 APPLICATION 成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("attachmentPermissionApplicationId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: attachmentPermissionApplicationId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
