info:
  name: 03 撤回待审核申请
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 整改续办

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/withdraw"
  body:
    type: json
    data: |-
      {
        "id": {{resubmitReplaceRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("撤回待审核申请成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
