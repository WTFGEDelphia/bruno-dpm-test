info:
  name: 05 已完成申请再次审批被拒绝
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 重复审批

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{approvalCompatAgreeRequestId}},
        "decision": "DISAGREE",
        "opinion": "已完成申请不能再次审批",
        "directiveAttachmentIds": []
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("已完成申请再次审批被业务拒绝", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("申请状态");
        });

        test("重复审批失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
