info:
  name: 12 查询英文不同意后详情
  type: http
  seq: 12
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批兼容

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{approvalCompatDisagreeRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function rejectLogs(flowLogs) {
          return (flowLogs || []).filter(item => item.actionText === "处置办理：不同意" || item.conclusion === "不同意");
        }

        test("英文 DISAGREE 审批后状态为已驳回", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("approvalCompatDisagreeRequestId")));
          expect(json.data.status).to.equal("REJECTED");
          expect(json.data.directiveStatus).to.equal("NONE");
          expect(json.data.authorization || null).to.equal(null);
        });

        test("英文 DISAGREE 审批流程日志按不同意记录", () => {
          const json = res.getBody();
          const logs = rejectLogs(json.data.flowLogs);
          expect(logs).to.have.length(1);
          expect(logs[0].opinion).to.contain("English decision DISAGREE");
          expect(JSON.stringify(logs[0])).to.not.contain("storagePath");
          expect(JSON.stringify(logs[0])).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
