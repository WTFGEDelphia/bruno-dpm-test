info:
  name: 04 查询驳回后详情
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P0
    - 驳回整改

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{rejectResubmitRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function body() {
          return res.getBody();
        }

        test("驳回后状态为 REJECTED 且无授权", () => {
          expect(res.getStatus()).to.equal(200);
          const json = body();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("rejectResubmitRequestId")));
          expect(json.data.status).to.equal("REJECTED");
          expect(json.data.directiveStatus).to.equal("NONE");
          expect(json.data.authorization || null).to.equal(null);
          expect(json.data.requestNo).to.equal(bru.getVar("rejectResubmitRequestNo"));
        });

        test("驳回流程日志记录不同意意见", () => {
          const flowLogs = body().data.flowLogs || [];
          const rejected = flowLogs.find(item => item.actionText === "处置办理：不同意" || item.conclusion === "不同意");
          expect(rejected, "流程日志应包含不同意审批节点").to.exist;
          expect(rejected.opinion).to.contain("申请材料不完整");
          expect(JSON.stringify(rejected)).to.not.contain("storagePath");
          expect(JSON.stringify(rejected)).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
