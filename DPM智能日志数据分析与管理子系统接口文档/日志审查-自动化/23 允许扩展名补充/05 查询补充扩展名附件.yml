info:
  name: 05 查询补充扩展名附件
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P2
    - 附件边界

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{extensionSupplementRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function activeApplicationAttachments(attachments) {
          return (attachments || []).filter(item => item.attachmentType === "APPLICATION" && item.deleted !== true);
        }

        test("补充允许扩展名附件均出现在详情中", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const attachments = activeApplicationAttachments(json.data.attachments);
          expect(attachments).to.have.length(3);
          expect(attachments.map(item => item.fileName)).to.include("allowed-attachment.docx");
          expect(attachments.map(item => item.fileName)).to.include("allowed-attachment.xls");
          expect(attachments.map(item => item.fileName)).to.include("allowed-attachment.jpeg");
          expect(attachments.map(item => item.id)).to.include(Number(bru.getVar("extensionSupplementDocxAttachmentId")));
          expect(attachments.map(item => item.id)).to.include(Number(bru.getVar("extensionSupplementXlsAttachmentId")));
          expect(attachments.map(item => item.id)).to.include(Number(bru.getVar("extensionSupplementJpegAttachmentId")));
          expect(JSON.stringify(json.data.attachments || [])).to.not.contain("storagePath");
          expect(JSON.stringify(json.data.attachments || [])).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
