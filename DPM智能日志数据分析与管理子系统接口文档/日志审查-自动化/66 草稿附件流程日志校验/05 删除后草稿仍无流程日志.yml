info:
  name: 05 删除后草稿仍无流程日志
  type: http
  seq: 5
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{draftAttachmentFlowDraftId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("草稿删除附件后仍无用户流程日志且当前附件不展示", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.status).to.equal("DRAFT");
          expect(data.flowLogs || []).to.have.length(0);
          const attachmentId = Number(bru.getVar("draftAttachmentFlowAttachmentId"));
          const attachments = data.attachments || [];
          expect(attachments.some(item => item.id === attachmentId)).to.equal(false);
          const text = JSON.stringify(data);
          expect(text).to.not.contain("上传日志请查附件");
          expect(text).to.not.contain("删除日志请查附件");
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
