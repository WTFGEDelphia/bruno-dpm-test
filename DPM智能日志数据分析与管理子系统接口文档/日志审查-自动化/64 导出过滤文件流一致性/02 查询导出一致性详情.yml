info:
  name: 02 查询导出一致性详情
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{exportConsistencyRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("导出一致性申请详情可回查", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("exportConsistencyRequestId")));
          expect(data.status).to.equal("PENDING");
          expect(data.urgent).to.equal(true);
          expect(data.requestNo).to.be.a("string").and.not.empty;
          bru.setVar("exportConsistencyRequestNo", data.requestNo);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: exportConsistencyRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
