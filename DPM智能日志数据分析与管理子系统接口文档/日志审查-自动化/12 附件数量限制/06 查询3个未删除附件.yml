info:
  name: 06 查询3个未删除附件
  type: http
  seq: 6
  tags:
    - 日志请查
    - 自动化
    - P2
    - 附件
    - 数量限制

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{attachmentLimitRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function activeApplicationAttachments(attachments) {
          return (attachments || []).filter(item => item.attachmentType === "APPLICATION" && item.deleted !== true);
        }

        test("同类型附件达到 3 个后详情只展示 3 个未删除 APPLICATION", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          const attachments = activeApplicationAttachments(json.data.attachments);
          expect(attachments).to.have.length(3);
          expect(attachments.map(item => item.id)).to.include(Number(bru.getVar("applicationLimitAttachment1Id")));
          expect(attachments.map(item => item.id)).to.include(Number(bru.getVar("applicationLimitAttachment2Id")));
          expect(attachments.map(item => item.id)).to.include(Number(bru.getVar("applicationLimitAttachment3Id")));
          expect(JSON.stringify(json.data.attachments || [])).to.not.contain("storagePath");
          expect(JSON.stringify(json.data.attachments || [])).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
