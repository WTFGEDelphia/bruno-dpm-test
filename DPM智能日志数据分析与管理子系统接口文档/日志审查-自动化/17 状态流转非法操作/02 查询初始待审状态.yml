info:
  name: 02 查询初始待审状态
  type: http
  seq: 2
  tags:
    - 日志请查
    - 自动化
    - P1
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{stateGuardRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("初始状态为 PENDING", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data.id).to.equal(Number(bru.getVar("stateGuardRequestId")));
          expect(json.data.status).to.equal("PENDING");
          expect(json.data.requestNo).to.be.a("string").and.not.empty;
          bru.setVar("stateGuardRequestNo", json.data.requestNo);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: stateGuardRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
