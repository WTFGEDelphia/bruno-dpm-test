info:
  name: 10 已作废不能撤回
  type: http
  seq: 10
  tags:
    - 日志请查
    - 自动化
    - P1
    - 状态流转

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/withdraw"
  body:
    type: json
    data: |-
      {
        "id": {{stateGuardRequestId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function bodyText() {
          return JSON.stringify(res.getBody());
        }

        test("VOIDED 申请不能撤回", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          expect(json.reason || json.message || bodyText()).to.contain("仅待审核");
        });

        test("已作废撤回失败响应不泄露存储路径", () => {
          const text = bodyText();
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
