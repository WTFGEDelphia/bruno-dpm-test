info:
  name: 24 附件超大文件限制
  type: folder
  seq: 24

request:
  auth: inherit

docs: |-
  P2 附件大小边界链路。运行前需要在集合根目录生成本地临时文件 `files/generated/oversize-attachment.csv`，大小为 10MB + 1 字节：
  `python3 -c "from pathlib import Path; p=Path('files/generated/oversize-attachment.csv'); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(b'a' * (10 * 1024 * 1024 + 1))"`
  `files/generated/` 已被仓库 .gitignore 忽略，避免提交大文件。
