info:
  name: 04 不同意带附件被拒绝
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P1
    - 审批规则

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/approve"
  body:
    type: json
    data: |-
      {
        "id": {{approvalRuleRequestId}},
        "decision": "不同意",
        "opinion": "不同意办理",
        "directiveAttachmentIds": [999999]
      }
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        function expectBusinessDenied() {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.not.equal(200);
          const text = JSON.stringify(json);
          expect(text).to.not.contain("storagePath");
          expect(text).to.not.contain("/Users/");
          return json;
        }

        test("不同意带附件被拒绝", () => {
          const json = expectBusinessDenied();
          expect(json.reason).to.contain("不能绑定");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
