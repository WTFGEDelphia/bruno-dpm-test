info:
  name: 04 上传领导批示附件
  type: http
  seq: 4
  tags:
    - 日志请查
    - 自动化
    - P0
    - 审批闭环
    - 附件

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/attachments/upload?requestId={{approvalRequestId}}&attachmentType=LEADER_DIRECTIVE"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/fixtures/leader-directive.csv
  auth:
    type: bearer
    token: "{{provinceToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("上传领导批示附件成功", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          expect(["success", "成功"]).to.include(json.reason);
          expect(json.data).to.be.a("number");
          expect(json.data).to.be.greaterThan(0);
          bru.setVar("directiveAttachmentId", String(json.data));
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data
        method: jsonq
      variable:
        name: directiveAttachmentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
