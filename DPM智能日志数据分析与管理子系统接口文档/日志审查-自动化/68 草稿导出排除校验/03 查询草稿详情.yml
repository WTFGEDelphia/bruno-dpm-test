info:
  name: 03 查询草稿详情
  type: http
  seq: 3
  tags:
    - 日志请查
    - 自动化
    - P1
    - 草稿
    - 导出

http:
  method: POST
  url: "{{baseUrl}}/api/v1/log-requests/detail"
  body:
    type: json
    data: |-
      {
        "id": {{draftExportDraftId}}
      }
  auth:
    type: bearer
    token: "{{applicantToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("草稿详情可见且状态展示为草稿", () => {
          expect(res.getStatus()).to.equal(200);
          const json = res.getBody();
          expect(json.code).to.equal(200);
          const data = json.data;
          expect(data.id).to.equal(Number(bru.getVar("draftExportDraftId")));
          expect(data.status).to.equal("DRAFT");
          expect(data.statusDisplay).to.equal("草稿");
          expect(data.requestNo).to.be.a("string").and.not.empty;
          expect(data.flowLogs || []).to.have.length(0);
          bru.setVar("draftExportRequestNo", data.requestNo);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: data.requestNo
        method: jsonq
      variable:
        name: draftExportRequestNo
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
