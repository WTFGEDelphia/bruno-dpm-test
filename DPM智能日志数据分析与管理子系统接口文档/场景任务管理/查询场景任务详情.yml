info:
  name: 查询场景任务详情
  type: http
  seq: 4
  tags:
    - 场景任务管理

http:
  method: POST
  url: "{{baseUrl}}/api/v1/scenario-tasks/detail"
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
