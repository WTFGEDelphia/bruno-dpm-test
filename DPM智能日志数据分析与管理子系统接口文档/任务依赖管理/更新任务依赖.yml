info:
  name: 更新任务依赖
  type: http
  seq: 2
  tags:
    - 任务依赖管理

http:
  method: POST
  url: "{{baseUrl}}/api/v1/scenario-tasks/:taskId/dependencies/update"
  params:
    - name: taskId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "taskId": 0,
        "dependsOnId": 0,
        "depType": "",
        "depParams": {},
        "depEnabled": false,
        "depStatus": "",
        "lastTriggerTime": "",
        "triggerCount": 0,
        "createdTime": "",
        "id": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

