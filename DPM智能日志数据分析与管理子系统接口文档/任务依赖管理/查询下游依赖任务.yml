info:
  name: 查询下游依赖任务
  type: http
  seq: 5
  tags:
    - 任务依赖管理

http:
  method: POST
  url: "{{baseUrl}}/api/v1/scenario-tasks/:taskId/dependencies/dependents"
  params:
    - name: taskId
      value: ""
      type: path
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/scenario-tasks/:taskId/dependencies/dependents"
      method: POST
      params:
        - name: taskId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "code": 0,
            "reason": "",
            "data": [
              {
                "taskId": 0,
                "dependsOnId": 0,
                "depType": "",
                "depParams": {},
                "depEnabled": false,
                "depStatus": "",
                "lastTriggerTime": "",
                "triggerCount": 0,
                "createdTime": "",
                "id": 0
              }
            ],
            "timestamp": 0
