info:
  name: 查询任务依赖详情
  type: http
  seq: 4
  tags:
    - 任务依赖管理

http:
  method: POST
  url: "{{baseUrl}}/api/v1/scenario-tasks/:taskId/dependencies/detail"
  params:
    - name: taskId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
