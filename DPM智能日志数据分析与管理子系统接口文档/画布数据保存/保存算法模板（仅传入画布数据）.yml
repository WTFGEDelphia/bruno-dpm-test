info:
  name: 保存算法模板（仅传入画布数据）
  type: http
  seq: 1
  tags:
    - 画布数据保存

http:
  method: POST
  url: "{{baseUrl}}/canvasData/saveAlgorithmTemplate"
  body:
    type: json
    data: "{}"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/canvasData/saveAlgorithmTemplate"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "0"
