info:
  name: 查询告警区域选项
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/alarm-rule-resources/areas/options"
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
  body:
    type: json
    data: |-
      {
        "areaLevels": [1, 2, 3],
        "areaCode": "",
        "keyword": ""
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
