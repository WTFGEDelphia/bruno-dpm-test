info:
  name: 获取连接池监控信息
  type: http
  seq: 1
  tags:
    - 系统监控管理

http:
  method: POST
  url: "{{baseUrl}}/monitoring/connection-pool-stats"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/monitoring/connection-pool-stats"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "{}"
