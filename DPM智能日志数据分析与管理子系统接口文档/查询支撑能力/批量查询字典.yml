info:
  name: 批量查询字典
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/query-support/dictionaries/batch"
  body:
    type: json
    data: |-
      {
        "codes": ["DICT_TYPE_001", "DICT_TYPE_002"]
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
