info:
  name: 预览算法
  type: http
  seq: 2
  tags:
    - 算法模板表管理

http:
  method: POST
  url: "{{baseUrl}}/algorithmTemplate/preview"
  body:
    type: json
    data: |-
      {
        "canvasData": {
          "empty": false
        },
        "nodeKeys": {}
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/algorithmTemplate/preview"
      method: POST
      body:
        type: json
        data: |-
          {
            "canvasData": {
              "empty": false
            },
            "nodeKeys": {}
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "canvasData": {
              "empty": false
            },
            "logicExpression": "",
            "generatedSql": ""
          }

docs: 预览指定ID的算法模型（生成逻辑表达式和SQL，但不执行），验证失败返回空对象
