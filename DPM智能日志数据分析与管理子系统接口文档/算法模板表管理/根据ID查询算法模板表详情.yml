info:
  name: 根据ID查询算法模板表详情
  type: http
  seq: 4
  tags:
    - 算法模板表管理

http:
  method: POST
  url: "{{baseUrl}}/algorithmTemplate/detail"
  body:
    type: json
    data: |-
      {
        "id": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/algorithmTemplate/detail"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "templateName": "",
            "description": "",
            "ownerId": "",
            "orgId": "",
            "canvasData": {
              "empty": false
            },
            "nodeKeys": {},
            "generatedSql": "",
            "isPublic": 0,
            "createdTime": "",
            "id": 0,
            "orgName": "",
            "loginName": "",
            "userName": ""
          }
