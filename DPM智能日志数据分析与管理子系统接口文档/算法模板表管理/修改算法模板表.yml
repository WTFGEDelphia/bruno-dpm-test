info:
  name: 修改算法模板表
  type: http
  seq: 1
  tags:
    - 算法模板表管理

http:
  method: POST
  url: "{{baseUrl}}/algorithmTemplate/update"
  body:
    type: json
    data: |-
      {
        "templateName": "",
        "description": "",
        "ownerId": "",
        "orgId": "",
        "canvasData": {
          "empty": false
        },
        "nodeKeys": {},
        "generatedSql": "",
        "isPublic": 0,
        "createdTime": "",
        "id": 0
      }
  headers:
    - name: Cookie
      value: tokenId={{applicantToken}}
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/algorithmTemplate/update"
      method: POST
      body:
        type: json
        data: |-
          {
            "templateName": "",
            "description": "",
            "ownerId": "",
            "orgId": "",
            "canvasData": {
              "empty": false
            },
            "nodeKeys": {},
            "generatedSql": "",
            "isPublic": 0,
            "createdTime": "",
            "id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "false"
