info:
  name: logout
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/public_ws/sys/user/logout"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("provinceToken", "", { persist: true });
        bru.setEnvVar("applicantToken", "", { persist: true });
        bru.setEnvVar("otherApplicantToken", "", { persist: true });
        bru.setEnvVar("applicantAccountId", "", { persist: true });
        bru.setEnvVar("applicantOrgId", "", { persist: true });
        bru.setEnvVar("targetOrgId", "", { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
